<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PARTICLE-STORM: 触控终极版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        :root {
            --bg: #000; --panel: rgba(15, 15, 15, 0.85); --text: #eee; 
            --accent: #00ffcc; --rec: #ff3b30; --border: #333;
        }
        body { 
            margin: 0; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif;
            /* 关键：禁止浏览器默认的滚动和缩放行为，让全屏触控更丝滑 */
            touch-action: none; 
        }
        
        /* 悬浮控制台 */
        .controls {
            position: absolute; top: 10px; right: 10px; width: 300px;
            background: var(--panel); backdrop-filter: blur(10px);
            padding: 15px; border-radius: 8px; border: 1px solid var(--border);
            display: flex; flex-direction: column; gap: 12px; z-index: 100;
            max-height: 90vh; overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            /* 防止点击控制台穿透到画布 */
            pointer-events: auto;
        }

        /* 隐藏滚动条但保留功能 */
        .controls::-webkit-scrollbar { width: 4px; }
        .controls::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

        h1 { margin: 0; font-size: 1.1rem; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        
        .section-title { font-size: 0.75rem; color: #888; text-transform: uppercase; margin-top: 5px; font-weight: bold; }

        label { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 2px; color: #ccc; }
        input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; height: 15px; /* 加大触控区域 */ background: transparent; }
        
        select, .btn {
            width: 100%; padding: 10px; background: #222; border: 1px solid #444; color: #fff;
            border-radius: 4px; cursor: pointer; font-weight: bold; text-align: center;
            transition: 0.2s; box-sizing: border-box; font-size: 0.85rem;
        }
        
        .btn-load { background: var(--accent); color: #000; border: none; }
        .btn-load:hover { filter: brightness(1.2); }
        
        .rec-panel { border: 1px solid var(--rec); padding: 10px; border-radius: 6px; background: rgba(255, 59, 48, 0.05); }
        .btn-rec { background: var(--rec); color: #fff; border: none; }
        .btn-rec:hover { filter: brightness(1.2); }
        .recording-dot { display: inline-block; width: 8px; height: 8px; background: #fff; border-radius: 50%; margin-right: 5px; animation: blink 1s infinite; }
        
        .export-panel { border: 1px solid #fff; padding: 10px; border-radius: 6px; }
        .btn-shot { background: #fff; color: #000; border: none; }
        
        input[type="file"] { display: none; }
        
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: var(--accent); font-size: 1.5rem; display: none; text-shadow: 0 0 10px var(--accent); pointer-events: none;
        }

        /* 移动端适配 */
        @media (max-width: 600px) {
            .controls { 
                width: auto; left: 10px; right: 10px; bottom: 10px; top: auto; 
                max-height: 40vh; /* 手机端面板在底部 */
            }
        }

        @keyframes blink { 50% { opacity: 0; } }
        #recTime { float: right; font-family: monospace; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="controls">
        <h1>Particle Storm <span style="font-size:0.6em">TOUCH</span></h1>
        
        <label class="btn btn-load">
            📂 载入图片 (UPLOAD)
            <input type="file" id="uploadInput" accept="image/*">
        </label>

        <div class="section-title">交互模式 (Mode)</div>
        <select id="modeSelect">
            <option value="nebula">☁️ 静态云雾 (Nebula 3D)</option>
            <option value="repel">💥 物理排斥 (Repel)</option>
            <option value="magnet">🧲 磁力吸引 (Magnet)</option>
            <option value="liquid">🌊 自动流体 (Liquid)</option>
        </select>

        <div class="section-title">物理参数 (Physics)</div>
        
        <label>粒子大小 (Size) <span id="v-size">1.5</span></label>
        <input type="range" id="pSize" min="0.1" max="5.0" step="0.1" value="1.5">
        
        <label>3D 深度 (Z-Depth) <span id="v-depth">100</span></label>
        <input type="range" id="pDepth" min="0" max="500" value="100">
        
        <label>力场强度 (Force) <span id="v-force">1.0</span></label>
        <input type="range" id="pForce" min="0.1" max="3.0" step="0.1" value="1.0">
        
        <label>复原速度 (Return) <span id="v-fric">0.1</span></label>
        <input type="range" id="pFric" min="0.01" max="0.3" step="0.01" value="0.1">

        <label>采样密度 (Density) <span id="v-dens">Med</span></label>
        <input type="range" id="pDens" min="1" max="5" step="1" value="3">
        <div style="font-size:0.6rem; color:#666; margin-bottom:5px;">* 密度修改需重新上传图片</div>

        <button class="btn" style="background:#333;" onclick="resetCamera()">🔄 重置相机视角</button>

        <div class="export-panel">
            <div class="section-title" style="color:#fff; margin-top:0;">📷 图片导出 (Image)</div>
            <div style="display:flex; gap:5px; margin-bottom:5px;">
                <select id="shotSize" style="width:40%;">
                    <option value="1">1x (Screen)</option>
                    <option value="2">2x (2K)</option>
                    <option value="3">3x (3K)</option>
                    <option value="4">4x (4K Print)</option>
                </select>
                <button class="btn btn-shot" style="width:60%;" onclick="takeSnapshot()">下载 JPG</button>
            </div>
        </div>

        <div class="rec-panel">
            <div class="section-title" style="color:var(--rec); margin-top:0;">
                🎥 视频录制 (Video) <span id="recTime">00:00</span>
            </div>
            <button class="btn btn-rec" id="btnRec" onclick="toggleRecord()">🔴 开始录制</button>
        </div>
    </div>

    <div id="loading">✨ 粒子生成中...</div>
    <div id="canvas-container"></div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        scene.fog = new THREE.FogExp2(0x000000, 0.0008); 

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 5000);
        camera.position.z = 800; 

        const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true, antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // ==========================================
        // 2. 交互逻辑 (支持 鼠标 + 触摸)
        // ==========================================
        const mouse = new THREE.Vector2(-9999, -9999);
        const raycaster = new THREE.Raycaster();
        const planeGeo = new THREE.PlaneGeometry(10000, 10000);
        const planeMat = new THREE.MeshBasicMaterial({ visible: false });
        const mousePlane = new THREE.Mesh(planeGeo, planeMat);
        scene.add(mousePlane);

        // 统一更新指针位置的函数
        function updatePointer(x, y) {
            mouse.x = (x / window.innerWidth) * 2 - 1;
            mouse.y = -(y / window.innerHeight) * 2 + 1;
        }

        // 鼠标监听
        document.addEventListener('mousemove', (e) => {
            e.preventDefault();
            updatePointer(e.clientX, e.clientY);
        });

        // 触摸监听 (核心新增)
        document.addEventListener('touchstart', (e) => {
            // 如果触摸点不在控制台上，才阻止默认行为（防止无法点击按钮）
            if (!e.target.closest('.controls')) {
                e.preventDefault();
                if (e.touches.length > 0) {
                    updatePointer(e.touches[0].clientX, e.touches[0].clientY);
                }
            }
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
            if (!e.target.closest('.controls')) {
                e.preventDefault();
                if (e.touches.length > 0) {
                    updatePointer(e.touches[0].clientX, e.touches[0].clientY);
                }
            }
        }, { passive: false });

        // 触摸结束时，将“力场点”移出屏幕，防止手指松开后粒子还聚在那
        document.addEventListener('touchend', () => {
            mouse.x = -9999;
            mouse.y = -9999;
        });


        // ==========================================
        // 3. 粒子系统核心 (保持不变)
        // ==========================================
        let particleSystem;
        let particlesData = []; 
        let originalImg = null;

        function getTexture() {
            const cvs = document.createElement('canvas');
            cvs.width = 32; cvs.height = 32;
            const ctx = cvs.getContext('2d');
            const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.4, 'rgba(255,255,255,0.5)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 32, 32);
            return new THREE.CanvasTexture(cvs);
        }
        const particleTexture = getTexture();

        const ui = {
            size: document.getElementById('pSize'),
            depth: document.getElementById('pDepth'),
            force: document.getElementById('pForce'),
            fric: document.getElementById('pFric'),
            dens: document.getElementById('pDens'),
            mode: document.getElementById('modeSelect')
        };

        ui.size.addEventListener('input', e => {
            document.getElementById('v-size').innerText = e.target.value;
            if(particleSystem) particleSystem.material.size = parseFloat(e.target.value);
        });
        ui.depth.addEventListener('input', e => document.getElementById('v-depth').innerText = e.target.value);
        ui.force.addEventListener('input', e => document.getElementById('v-force').innerText = e.target.value);
        ui.fric.addEventListener('input', e => document.getElementById('v-fric').innerText = e.target.value);
        ui.dens.addEventListener('input', e => {
            if(originalImg) createParticles(originalImg);
        });

        document.getElementById('uploadInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(!file) return;
            document.getElementById('loading').style.display = 'block';
            const reader = new FileReader();
            reader.onload = (evt) => {
                const img = new Image();
                img.src = evt.target.result;
                img.onload = () => {
                    originalImg = img;
                    createParticles(img);
                    document.getElementById('loading').style.display = 'none';
                };
            };
            reader.readAsDataURL(file);
        });

        function createParticles(image) {
            if(particleSystem) scene.remove(particleSystem);

            const canvas = document.createElement('canvas');
            const step = [10, 8, 6, 4, 2, 1][parseInt(ui.dens.value)];
            const maxW = 1000; 
            
            let w = image.width;
            let h = image.height;
            if (w > maxW) { h = Math.round(h * (maxW/w)); w = maxW; }

            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(image, 0, 0, w, h);
            const imgData = ctx.getImageData(0, 0, w, h).data;

            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];
            particlesData = [];

            for (let y = 0; y < h; y += step) {
                for (let x = 0; x < w; x += step) {
                    const i = (y * w + x) * 4;
                    const r = imgData[i] / 255;
                    const g = imgData[i+1] / 255;
                    const b = imgData[i+2] / 255;
                    const a = imgData[i+3];
                    const brightness = (r+g+b)/3;

                    if (a > 20) {
                        const px = x - w / 2;
                        const py = -(y - h / 2);
                        const pz = 0;

                        positions.push(px, py, pz);
                        colors.push(r, g, b);

                        particlesData.push({
                            ox: px, oy: py, 
                            x: px, y: py, z: pz, 
                            vx: 0, vy: 0, vz: 0, 
                            br: brightness, 
                            angle: Math.random() * Math.PI * 2 
                        });
                    }
                }
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: parseFloat(ui.size.value),
                map: particleTexture,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true,
                opacity: 0.9
            });

            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);
        }

        // ==========================================
        // 4. 物理模拟循环
        // ==========================================
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;
            controls.update();

            raycaster.setFromCamera(mouse, camera);
            const intersect = new THREE.Vector3();
            raycaster.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 0, 1), 0), intersect);

            if (particleSystem) {
                const positions = particleSystem.geometry.attributes.position.array;
                const mode = ui.mode.value;
                const depthScale = parseInt(ui.depth.value);
                const forceMult = parseFloat(ui.force.value);
                const friction = parseFloat(ui.fric.value);

                for (let i = 0; i < particlesData.length; i++) {
                    const p = particlesData[i];
                    
                    const targetZ = p.br * depthScale;
                    let tx = p.ox;
                    let ty = p.oy;
                    let tz = targetZ;

                    let fx = 0, fy = 0, fz = 0;

                    if (mode === 'nebula') {
                        tx += Math.sin(time + p.angle) * 5;
                        ty += Math.cos(time + p.angle) * 5;
                    } 
                    else if (mode === 'liquid') {
                        tx += Math.sin(p.oy * 0.02 + time * 2) * 20 * forceMult;
                        ty += Math.cos(p.ox * 0.02 + time * 2) * 20 * forceMult;
                    }
                    else if (mode === 'repel') {
                        const dx = p.x - intersect.x;
                        const dy = p.y - intersect.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        const radius = 150 * forceMult;
                        
                        if (dist < radius) {
                            const angle = Math.atan2(dy, dx);
                            const f = (radius - dist) / radius; 
                            fx += Math.cos(angle) * f * 20;
                            fy += Math.sin(angle) * f * 20;
                            fz += Math.sin(angle * 5) * f * 50; 
                        }
                    }
                    else if (mode === 'magnet') {
                        const dx = p.ox - intersect.x;
                        const dy = p.oy - intersect.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        
                        if (dist > 150 * forceMult) {
                            tx += Math.sin(p.angle + time) * 100;
                            ty += Math.cos(p.angle + time) * 100;
                            tz += Math.sin(p.angle) * 200;
                        }
                    }

                    const k = 0.05; 
                    p.vx += (tx - p.x) * k + fx;
                    p.vy += (ty - p.y) * k + fy;
                    p.vz += (tz - p.z) * k + fz;

                    p.vx *= (1 - friction);
                    p.vy *= (1 - friction);
                    p.vz *= (1 - friction);

                    p.x += p.vx;
                    p.y += p.vy;
                    p.z += p.vz;

                    const idx = i * 3;
                    positions[idx] = p.x;
                    positions[idx+1] = p.y;
                    positions[idx+2] = p.z;
                }
                particleSystem.geometry.attributes.position.needsUpdate = true;
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function resetCamera() {
            controls.reset();
            camera.position.set(0, 0, 800);
            camera.lookAt(0, 0, 0);
        }

        // ==========================================
        // 5. 导出功能 (JPG & Video)
        // ==========================================
        
        function takeSnapshot() {
            if (!particleSystem) return alert("请先载入图片！");
            
            const multiplier = parseInt(document.getElementById('shotSize').value);
            
            renderer.setSize(window.innerWidth * multiplier, window.innerHeight * multiplier);
            renderer.render(scene, camera);
            
            const link = document.createElement('a');
            link.download = `particle-storm-${multiplier}x-${Date.now()}.jpg`;
            link.href = renderer.domElement.toDataURL('image/jpeg', 0.95);
            link.click();
            
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;
        let timerInterval;
        let startTime;

        function toggleRecord() {
            const btn = document.getElementById('btnRec');
            if (!isRecording) {
                const stream = renderer.domElement.captureStream(60); 
                const mimeTypes = ['video/webm; codecs=vp9', 'video/webm; codecs=vp8', 'video/webm'];
                const mimeType = mimeTypes.find(type => MediaRecorder.isTypeSupported(type));

                if(!mimeType) return alert("您的浏览器不支持 WebM 录制");

                mediaRecorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 8000000 }); 
                
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = saveVideoFile;
                
                recordedChunks = [];
                mediaRecorder.start();
                isRecording = true;
                
                btn.innerHTML = `<span class="recording-dot"></span> 停止录制`;
                btn.style.background = "#fff";
                btn.style.color = "var(--rec)";
                
                startTime = Date.now();
                timerInterval = setInterval(() => {
                    const diff = Math.floor((Date.now() - startTime) / 1000);
                    const m = String(Math.floor(diff / 60)).padStart(2,'0');
                    const s = String(diff % 60).padStart(2,'0');
                    document.getElementById('recTime').innerText = `${m}:${s}`;
                }, 1000);

            } else {
                mediaRecorder.stop();
                isRecording = false;
                
                btn.innerHTML = "🔴 开始录制";
                btn.style.background = "var(--rec)";
                btn.style.color = "#fff";
                
                clearInterval(timerInterval);
                document.getElementById('recTime').innerText = "00:00";
            }
        }

        function saveVideoFile() {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `particle-video-${Date.now()}.webm`;
            a.click();
        }

    </script>

<script src="../lab-export.js"></script>
<script>
  // COOLINGDOWN LAB 统一导出
  LabExport.setup({
    name: 'particle-storm', image: LabExport.three(() => renderer, () => scene, () => camera), video: { source: () => renderer.domElement }, hide: ['.export-panel', '.rec-panel']
  });
</script>
