<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Art Pro - 算法图像处理</title>
    <style>
        :root {
            --bg-color: #050505;
            --panel-color: #1a1a1a;
            --accent-color: #00ff88; /* 荧光绿 */
            --secondary-color: #7000ff; /* 赛博紫 */
            --text-color: #eee;
        }

        body {
            font-family: 'Courier New', Courier, monospace; /* 极客字体 */
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin-top: 30px;
            text-transform: uppercase;
            letter-spacing: 4px;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
        }
        
        h1 span { color: var(--accent-color); }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            padding: 20px;
            width: 90%;
            max-width: 1200px;
        }

        .canvas-wrapper {
            position: relative;
            border: 1px solid #333;
            background: #000;
            /* 网格背景装饰 */
            background-image: linear-gradient(#111 1px, transparent 1px),
            linear-gradient(90deg, #111 1px, transparent 1px);
            background-size: 20px 20px;
        }

        canvas {
            max-width: 100%;
            height: auto;
            display: block;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.1);
        }

        .controls {
            background-color: var(--panel-color);
            padding: 25px;
            border-radius: 0;
            border: 1px solid #444;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            width: 100%;
            box-sizing: border-box;
        }

        button, .file-upload {
            padding: 12px 24px;
            border: 1px solid var(--accent-color);
            background: transparent;
            color: var(--accent-color);
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        button:hover, .file-upload:hover {
            background: var(--accent-color);
            color: #000;
            box-shadow: 0 0 15px var(--accent-color);
        }

        /* 特殊按钮样式 */
        .btn-purple { border-color: var(--secondary-color); color: var(--secondary-color); }
        .btn-purple:hover { background: var(--secondary-color); color: #fff; box-shadow: 0 0 15px var(--secondary-color);}

        .btn-reset { border-color: #ff3333; color: #ff3333; }
        .btn-reset:hover { background: #ff3333; color: white; box-shadow: 0 0 15px #ff3333;}

        input[type="file"] { display: none; }
        .status { margin-top: 10px; color: #666; font-size: 0.8rem; }
    </style>
</head>
<body>

    <h1>Algo<span>.Img</span> Pro</h1>

    <div class="container">
        <div class="controls">
            <label class="file-upload">
                [ + UPLOAD IMAGE ]
                <input type="file" id="uploadInput" accept="image/*">
            </label>
            
            <button onclick="applyPixelSort()">🌪️ 像素排序 (Pixel Sort)</button>
            <button onclick="applyHologram()">🌊 全息波纹 (Hologram)</button>
            <button class="btn-purple" onclick="applyDithering()">🏁 复古抖动 (Dither)</button>
            
            <button class="btn-reset" onclick="resetImage()">🔄 RESET</button>
            <button class="btn-purple" onclick="downloadImage()">💾 SAVE</button>
        </div>

        <div class="status" id="statusText">等待上传图片...</div>

        <div class="canvas-wrapper">
            <canvas id="editorCanvas"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('editorCanvas');
        const ctx = canvas.getContext('2d');
        const uploadInput = document.getElementById('uploadInput');
        const statusText = document.getElementById('statusText');
        
        let originalImage = null;

        // 辅助函数：更新状态文字
        function setStatus(msg) { statusText.innerText = msg; }

        // 1. 上传图片
        uploadInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            setStatus("正在加载图片...");

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    // 限制最大宽度，防止高阶算法卡死浏览器
                    let w = img.width;
                    let h = img.height;
                    const maxW = 2400; // LAB：提高工作分辨率，导出更清晰
                    if (w > maxW) {
                        h = h * (maxW / w);
                        w = maxW;
                    }
                    
                    canvas.width = w;
                    canvas.height = h;
                    ctx.drawImage(img, 0, 0, w, h);
                    originalImage = ctx.getImageData(0,0,w,h); // 保存原始像素数据
                    setStatus("图片已就绪. 分辨率已优化以适配算法.");
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        // 2. 高阶算法：像素排序 (Pixel Sorting)
        // 这是一个简化的版本，为了性能只处理高亮部分
        function applyPixelSort() {
            if (!originalImage) return alert("NO IMAGE SOURCE");
            setStatus("正在执行像素排序算法...");

            // 稍微延时以允许UI渲染文字
            setTimeout(() => {
                const w = canvas.width;
                const h = canvas.height;
                const imageData = ctx.getImageData(0, 0, w, h);
                const data = imageData.data;

                // 简单的排序逻辑：按列遍历
                for (let x = 0; x < w; x++) {
                    let columnPixels = [];
                    // 1. 提取每一列的像素
                    for (let y = 0; y < h; y++) {
                        const i = (y * w + x) * 4;
                        columnPixels.push({
                            r: data[i], g: data[i+1], b: data[i+2], a: data[i+3],
                            brightness: data[i] + data[i+1] + data[i+2]
                        });
                    }

                    // 2. 核心算法：只排序亮度高于某个阈值的部分 (模拟溶解效果)
                    // 如果你想全图排序，可以去掉阈值判断，但图片会完全变成线条
                    let start = -1;
                    for (let y = 0; y < h; y++) {
                        // 阈值设为 100 (0-765范围)
                        if (columnPixels[y].brightness > 100) {
                            if (start === -1) start = y;
                        } else {
                            if (start !== -1) {
                                // 这一段结束了，对 start 到 y 之间的像素排序
                                const segment = columnPixels.slice(start, y);
                                // 按亮度排序
                                segment.sort((a, b) => b.brightness - a.brightness);
                                // 放回去
                                for (let k = 0; k < segment.length; k++) {
                                    columnPixels[start + k] = segment[k];
                                }
                                start = -1;
                            }
                        }
                    }

                    // 3. 将排序后的像素写回 data
                    for (let y = 0; y < h; y++) {
                        const i = (y * w + x) * 4;
                        const p = columnPixels[y];
                        data[i] = p.r; data[i+1] = p.g; data[i+2] = p.b; data[i+3] = p.a;
                    }
                }

                ctx.putImageData(imageData, 0, 0);
                setStatus("像素排序完成.");
            }, 50);
        }

        // 3. 高阶算法：全息波纹 (Sine Wave Distortion)
        function applyHologram() {
            if (!originalImage) return alert("NO IMAGE SOURCE");
            
            const w = canvas.width;
            const h = canvas.height;
            // 获取当前画布内容（允许叠加效果）
            const sourceData = ctx.getImageData(0, 0, w, h);
            const outputData = ctx.createImageData(w, h); // 创建空白新图

            // 参数：波浪频率和幅度
            const frequency = 0.05; 
            const amplitude = 10; 

            for (let y = 0; y < h; y++) {
                // 计算当前行的 X 轴偏移量 (正弦波)
                const xOffset = Math.floor(Math.sin(y * frequency) * amplitude);

                for (let x = 0; x < w; x++) {
                    let sourceX = x + xOffset;
                    
                    // 边界处理：超出部分循环读取或留空
                    if (sourceX >= 0 && sourceX < w) {
                        const sourceIdx = (y * w + sourceX) * 4;
                        const targetIdx = (y * w + x) * 4;

                        // 简单的色差分离 (RGB Shift) - 增加科技感
                        // R 通道取偏移位置
                        outputData.data[targetIdx] = sourceData.data[sourceIdx]; 
                        // G 通道取原位置 (产生错位色差)
                        outputData.data[targetIdx + 1] = sourceData.data[(y * w + x) * 4 + 1];
                        // B 通道取偏移位置
                        outputData.data[targetIdx + 2] = sourceData.data[sourceIdx + 2];
                        outputData.data[targetIdx + 3] = 255; // Alpha
                    }
                }
            }
            
            // 添加扫描线效果
            for(let i=0; i<outputData.data.length; i+=4) {
                 // 每隔 2 行变暗一行
                 const y = Math.floor((i / 4) / w);
                 if (y % 2 === 0) {
                     outputData.data[i] *= 0.7;
                     outputData.data[i+1] *= 0.7;
                     outputData.data[i+2] *= 0.7;
                 }
            }

            ctx.putImageData(outputData, 0, 0);
            setStatus("全息波纹已应用.");
        }

        // 4. 高阶算法：Atkinson 抖动 (Retro Dithering)
        // 这是将彩色图片转换为只有黑白两色（或极少颜色）的经典算法
        function applyDithering() {
            if (!originalImage) return alert("NO IMAGE SOURCE");
            setStatus("正在计算 Dither 矩阵...");

            setTimeout(() => {
                const w = canvas.width;
                const h = canvas.height;
                const imageData = ctx.getImageData(0, 0, w, h);
                const data = imageData.data;

                // 遍历每一个像素
                for (let y = 0; y < h; y++) {
                    for (let x = 0; x < w; x++) {
                        const i = (y * w + x) * 4;
                        
                        // 1. 转为灰度
                        const oldPixel = (data[i] + data[i+1] + data[i+2]) / 3;
                        
                        // 2. 阈值判断：非黑即白
                        const newPixel = oldPixel < 128 ? 0 : 255;
                        
                        // 3. 计算“量化误差” (Quantization Error)
                        const error = oldPixel - newPixel;

                        // 更新当前像素
                        data[i] = data[i+1] = data[i+2] = newPixel;

                        // 4. 将误差扩散到周围的像素 (Floyd-Steinberg 算法简化版)
                        // 右边
                        if (x + 1 < w) distributeError(data, (y * w + x + 1) * 4, error * 7/16);
                        // 左下
                        if (y + 1 < h && x > 0) distributeError(data, ((y + 1) * w + x - 1) * 4, error * 3/16);
                        // 正下
                        if (y + 1 < h) distributeError(data, ((y + 1) * w + x) * 4, error * 5/16);
                        // 右下
                        if (y + 1 < h && x + 1 < w) distributeError(data, ((y + 1) * w + x + 1) * 4, error * 1/16);
                    }
                }
                ctx.putImageData(imageData, 0, 0);
                setStatus("1-Bit 抖动处理完成.");
            }, 50);
        }

        function distributeError(data, index, amount) {
            data[index] += amount;
            data[index+1] += amount;
            data[index+2] += amount;
        }

        function resetImage() {
            if (originalImage) ctx.putImageData(originalImage, 0, 0);
            setStatus("画面已重置.");
        }

        function downloadImage() {
            if (!originalImage) return;
            const link = document.createElement('a');
            link.download = 'cyber-pro-art.png';
            link.href = canvas.toDataURL();
            link.click();
        }
    </script>

<script src="../lab-export.js"></script>
<script>
  // COOLINGDOWN LAB 统一导出
  LabExport.setup({
    name: 'cyber-art-pro', ready: () => !!originalImage,
    image: Object.assign(LabExport.pixelCanvas(() => canvas), { note: '“像素放大”用最近邻插值，像素边缘保持锐利。PNG 无损，适合继续在 PS / AI 里编辑。' }),
    hide: ['[onclick="downloadImage()"]']
  });
</script>
