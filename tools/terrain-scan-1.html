<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERRAIN-SCAN: 3D 扫描线地形</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        :root { --bg: #000; --panel: rgba(10, 30, 20, 0.85); --text: #0f0; --accent: #0f0; }
        body { margin: 0; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; }
        .controls {
            position: absolute; top: 20px; left: 20px; width: 300px;
            background: var(--panel); padding: 20px; border: 1px solid var(--accent);
            border-radius: 4px; display: flex; flex-direction: column; gap: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
        }
        h1 { margin: 0; font-size: 1.2rem; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
        .btn-load { width: 100%; padding: 10px; background: #000; border: 1px solid var(--accent); color: var(--accent); cursor: pointer; text-align: center; font-weight: bold; }
        .btn-load:hover { background: var(--accent); color: #000; }
        input[type="file"] { display: none; }
        input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }
        label { display: flex; justify-content: space-between; font-size: 0.8rem; }
        #loading { position: absolute; top:50%; left:50%; transform:translate(-50%,-50%); color: var(--accent); display: none; }
        .scan-overlay { position: absolute; top:0; left:0; width:100%; height:100%; pointer-events: none; background: linear-gradient(transparent 95%, rgba(0,255,0,0.1) 98%, rgba(0,255,0,0.5) 100%); background-size: 100% 50px; animation: scan 2s linear infinite; opacity: 0.3; }
        @keyframes scan { from {background-position: 0 0;} to {background-position: 0 50px;} }
    </style>
</head>
<body>
    <div class="scan-overlay"></div>
    <div class="controls">
        <h1>TERRAIN-SCAN V.1</h1>
        <label class="btn-load">
            [ LOAD SOURCE IMAGE ]
            <input type="file" id="upload" accept="image/*">
        </label>
        <div>
            <label>DISPLACEMENT (高度) <span id="v-height">100</span></label>
            <input type="range" id="height" min="0" max="300" value="100">
        </div>
        <div>
            <label>GRID DENSITY (网格密度) <span id="v-seg">128</span></label>
            <input type="range" id="segments" min="64" max="256" step="32" value="128">
            <div style="font-size:0.7rem; opacity:0.7;">* Requires re-upload to apply</div>
        </div>
        <div style="border-top: 1px solid var(--accent); padding-top:15px;">
            <label>EXPORT RESOLUTION</label>
            <select id="exportSize" style="width:100%; padding:8px; background:#000; color:var(--accent); border:1px solid var(--accent); margin-bottom:10px;">
                <option value="1">1x (SCREEN)</option>
                <option value="2">2x (HIGH-RES)</option>
                <option value="4">4K (ULTRA-RES)</option>
            </select>
            <button class="btn-load" onclick="saveImage()">[ CAPTURE SCAN ]</button>
        </div>
    </div>
    <div id="loading">ANALYZING TOPOGRAPHY...</div>
    <div id="canvas-container"></div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000500);
        scene.fog = new THREE.FogExp2(0x000500, 0.0015);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 2000);
        camera.position.set(0, 200, 400);

        const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true, antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.2;

        let terrainMesh, wireframe;
        let sourceImg = null;

        const ui = {
            height: document.getElementById('height'),
            segments: document.getElementById('segments')
        };

        ui.height.addEventListener('input', e => {
            document.getElementById('v-height').innerText = e.target.value;
            if (sourceImg) generateTerrain();
        });
        ui.segments.addEventListener('input', e => document.getElementById('v-seg').innerText = e.target.value);

        document.getElementById('upload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('loading').style.display = 'block';
            const reader = new FileReader();
            reader.onload = (evt) => {
                const img = new Image();
                img.onload = () => {
                    sourceImg = img;
                    generateTerrain();
                    document.getElementById('loading').style.display = 'none';
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        });

        function generateTerrain() {
            if (terrainMesh) { scene.remove(terrainMesh); scene.remove(wireframe); }

            const seg = parseInt(ui.segments.value);
            const depth = parseInt(ui.height.value);
            
            // 1. 读取图片数据
            const canvas = document.createElement('canvas');
            canvas.width = seg; canvas.height = seg;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(sourceImg, 0, 0, seg, seg);
            const imgData = ctx.getImageData(0, 0, seg, seg).data;

            // 2. 创建平面几何体
            const geometry = new THREE.PlaneGeometry(400, 400, seg - 1, seg - 1);
            const vertices = geometry.attributes.position.array;

            // 3. 根据像素亮度调整顶点 Z 坐标
            for (let i = 0, j = 0; i < vertices.length; i += 3, j += 4) {
                // 简单的亮度计算
                const brightness = (imgData[j] + imgData[j+1] + imgData[j+2]) / 3;
                vertices[i + 2] = (brightness / 255) * depth;
            }
            geometry.computeVertexNormals();

            // 4. 创建线框材质 (关键)
            // 使用 LineSegments 而不是 WireframeGeometry 可以得到更干净的网格
            const wireframeGeo = new THREE.EdgesGeometry(geometry, 1); // 阈值1只显示主要结构
            const matLine = new THREE.LineBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.8 });
            wireframe = new THREE.LineSegments(wireframeGeo, matLine);
            wireframe.rotation.x = -Math.PI / 2;
            scene.add(wireframe);

            // 5. 创建一个黑色遮挡平面在下方，增加层次感
            const planeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            terrainMesh = new THREE.Mesh(geometry, planeMat);
            terrainMesh.rotation.x = -Math.PI / 2;
            terrainMesh.position.y = -0.5; // 稍微错开一点
            scene.add(terrainMesh);
        }

        // 扫描线动画
        let scanTime = 0;
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            scanTime += 0.01;
            if(wireframe) {
                // 简单的材质颜色脉冲
                const intensity = (Math.sin(scanTime * 2) * 0.2) + 0.8;
                wireframe.material.color.setRGB(0, intensity, 0);
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function saveImage() {
            if (!sourceImg) return alert("NO DATA SOURCE LOADED.");
            const multiplier = parseInt(document.getElementById('exportSize').value);
            renderer.setSize(window.innerWidth * multiplier, window.innerHeight * multiplier);
            renderer.render(scene, camera);
            const link = document.createElement('a');
            link.download = `terrain-scan-${multiplier}x.jpg`;
            link.href = renderer.domElement.toDataURL('image/jpeg', 0.95);
            link.click();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>

</style>
</body>
</html>
