<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THERMAL VISION LAB: 热成像生成器</title>
    <style>
        :root {
            --bg: #050505;
            --panel: #1a1a1a;
            --text: #eee;
            --accent: #ff4d00; /* 热成像橙 */
            --border: #333;
        }

        body {
            font-family: 'Segoe UI', 'Courier New', monospace;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 5px;
            color: var(--accent);
            text-shadow: 0 0 10px rgba(255, 77, 0, 0.5);
        }
        
        .hud-line {
            width: 100%; max-width: 1200px; height: 1px; background: #333; margin-bottom: 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .hud-text { font-size: 0.7rem; color: #555; background: #000; padding: 0 10px;}

        .main-layout {
            display: flex; gap: 20px; width: 100%; max-width: 1200px;
            justify-content: center; align-items: flex-start; flex-wrap: wrap;
        }

        .controls {
            width: 300px;
            background: var(--panel);
            padding: 25px;
            border-radius: 4px;
            border: 1px solid #444;
            display: flex; flex-direction: column; gap: 18px;
            flex-shrink: 0;
            /* 战术风格边框 */
            box-shadow: 0 0 0 1px #000, 0 0 20px rgba(0,0,0,0.8);
        }

        .canvas-wrapper {
            flex: 1; min-width: 400px; max-width: 900px;
            background: #000; border: 1px solid #333;
            position: relative; min-height: 400px;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }
        
        /* 模拟屏幕扫描线 */
        .scanlines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
            background-size: 100% 4px;
            pointer-events: none; z-index: 10;
            opacity: 0.3;
        }
        
        /* 模拟十字准星 */
        .crosshair {
            position: absolute; top: 50%; left: 50%; width: 40px; height: 40px;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 11;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .crosshair::before, .crosshair::after {
            content: ''; position: absolute; background: rgba(255, 255, 255, 0.5);
        }
        .crosshair::before { top: 19px; left: -10px; width: 60px; height: 1px; }
        .crosshair::after { left: 19px; top: -10px; height: 60px; width: 1px; }

        canvas { max-width: 100%; height: auto; display: block; }

        h3 { margin: 0 0 10px 0; font-size: 0.8rem; color: #888; text-transform: uppercase; border-left: 3px solid var(--accent); padding-left: 10px;}
        label { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 5px; color: #ccc; }
        
        input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; background: #000; height: 6px; }
        
        select, .btn {
            width: 100%; padding: 12px; background: #222; border: 1px solid #555;
            color: var(--accent); font-weight: bold; text-transform: uppercase; cursor: pointer;
            text-align: center; font-family: inherit; transition: 0.2s; box-sizing: border-box;
        }
        .btn:hover, select:hover { background: var(--accent); color: #000; box-shadow: 0 0 15px var(--accent); }
        .btn-main { background: var(--accent); color: #000; border: none; }
        .btn-main:hover { opacity: 0.9; }

        input[type="file"] { display: none; }
        
        /* 色板预览条 */
        #gradientPreview {
            width: 100%; height: 20px; border: 1px solid #555; margin-bottom: 10px;
        }
        
        #loadingText { position: absolute; color: var(--accent); pointer-events: none; display: none; font-weight: bold; text-shadow: 0 0 10px black;}
    </style>
</head>
<body>

    <h1>Thermal Vision Lab</h1>
    <div class="hud-line"><span class="hud-text">SYS.READY</span><span class="hud-text">INFRARED SENSOR V1.0</span></div>

    <div class="main-layout">
        <div class="controls">
            <label class="file-upload btn btn-main">
                📂 载入图像 (INPUT)
                <input type="file" id="upload" accept="image/*">
            </label>

            <div>
                <h3>🎨 战术色板 (Color Palette)</h3>
                <canvas id="gradientPreview" width="256" height="20"></canvas>
                <select id="palette">
                    <option value="ironbow">🔥 Ironbow (经典铁红)</option>
                    <option value="rainbow">🌈 Rainbow (科学彩虹)</option>
                    <option value="night">🌑 Night Vision (幽灵绿)</option>
                    <option value="arctic">❄️ Arctic (极寒蓝)</option>
                    <option value="whitehot">⚪ White Hot (白热)</option>
                    <option value="blackhot">⚫ Black Hot (黑热)</option>
                </select>
            </div>

            <div>
                <h3>🎛️ 传感器调校 (Sensor)</h3>
                <label>热感灵敏度 (Contrast) <span id="v-contrast">1.2</span></label>
                <input type="range" id="contrast" min="0.5" max="3.0" step="0.1" value="1.2">
                
                <label>温度偏移 (Offset) <span id="v-offset">0</span></label>
                <input type="range" id="offset" min="-100" max="100" value="0">

                <label>传感器噪点 (Noise) <span id="v-noise">20</span></label>
                <input type="range" id="noise" min="0" max="100" value="20">
                
                <label>镜头模糊 (Blur) <span id="v-blur">2</span></label>
                <input type="range" id="blur" min="0" max="10" value="2">
            </div>
            
            <div>
                <h3>📉 辅助显示 (HUD)</h3>
                <label>等温线 (Isolines) <span id="v-iso">0</span></label>
                <input type="range" id="isolines" min="0" max="10" step="1" value="0">
            </div>

            <div style="margin-top: 10px; border-top: 1px solid #333; padding-top: 20px;">
                <h3>💾 导出 (Export)</h3>
                <div style="display: flex; gap: 10px;">
                    <select id="exportSize" style="flex:1">
                        <option value="1">1x (预览)</option>
                        <option value="2">2x (高清)</option>
                        <option value="4">4x (超清)</option>
                    </select>
                    <button class="btn" onclick="downloadImage()">保存 JPG</button>
                </div>
            </div>
        </div>

        <div class="canvas-wrapper">
            <div class="scanlines"></div>
            <div class="crosshair"></div>
            <div id="loadingText">Processing...</div>
            <canvas id="canvas"></canvas>
        </div>
    </div>

    <canvas id="lutCanvas" width="256" height="1" style="display:none;"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const lutCanvas = document.getElementById('lutCanvas');
        const lutCtx = lutCanvas.getContext('2d');
        const gradPreview = document.getElementById('gradientPreview');
        const gradCtx = gradPreview.getContext('2d');
        const loadingText = document.getElementById('loadingText');

        let sourceImg = null;
        let renderTimeout;

        // UI 绑定
        const ui = {
            palette: document.getElementById('palette'),
            contrast: document.getElementById('contrast'),
            offset: document.getElementById('offset'),
            noise: document.getElementById('noise'),
            blur: document.getElementById('blur'),
            isolines: document.getElementById('isolines')
        };

        // 监听事件
        Object.keys(ui).forEach(key => {
            ui[key].addEventListener('input', (e) => {
                const span = document.getElementById(`v-${key}`);
                if (span) span.innerText = e.target.value;
                
                if (key === 'palette') updateLUT(); // 如果换色板，更新LUT
                
                triggerRender();
            });
        });

        // 生成颜色查找表 (LUT - Look Up Table)
        // 这是热成像的核心：创建一个 0-255 的渐变条，然后把图片的灰度值映射到这个条上
        function updateLUT() {
            const p = ui.palette.value;
            const w = 256;
            const h = 1;
            
            // 在 LUT canvas 上绘制渐变
            let grad = lutCtx.createLinearGradient(0, 0, w, 0);
            
            if (p === 'ironbow') {
                // 经典的紫-红-橙-黄-白
                grad.addColorStop(0.0, '#000000');
                grad.addColorStop(0.2, '#20008c'); // 深紫
                grad.addColorStop(0.4, '#cc00cc'); // 紫红
                grad.addColorStop(0.6, '#ff0000'); // 红
                grad.addColorStop(0.8, '#ffcc00'); // 黄
                grad.addColorStop(1.0, '#ffffff'); // 白
            } else if (p === 'rainbow') {
                // 科学彩虹：蓝-绿-红
                grad.addColorStop(0.0, '#0000ff');
                grad.addColorStop(0.2, '#00ffff');
                grad.addColorStop(0.5, '#00ff00');
                grad.addColorStop(0.8, '#ffff00');
                grad.addColorStop(1.0, '#ff0000');
            } else if (p === 'night') {
                // 夜视仪
                grad.addColorStop(0.0, '#000000');
                grad.addColorStop(0.1, '#003300');
                grad.addColorStop(0.8, '#00ff00');
                grad.addColorStop(1.0, '#ccffcc');
            } else if (p === 'arctic') {
                // 极寒：黑-深蓝-青-白
                grad.addColorStop(0.0, '#000000');
                grad.addColorStop(0.4, '#003366');
                grad.addColorStop(0.8, '#00ccff');
                grad.addColorStop(1.0, '#ffffff');
            } else if (p === 'whitehot') {
                grad.addColorStop(0.0, '#000');
                grad.addColorStop(1.0, '#fff');
            } else if (p === 'blackhot') {
                grad.addColorStop(0.0, '#fff');
                grad.addColorStop(1.0, '#000');
            }

            lutCtx.fillStyle = grad;
            lutCtx.fillRect(0, 0, w, h);

            // 同时更新预览条
            gradCtx.drawImage(lutCanvas, 0, 0, 256, 1, 0, 0, 256, 20);
            
            triggerRender();
        }

        function triggerRender() {
            if (renderTimeout) clearTimeout(renderTimeout);
            loadingText.style.display = 'block';
            renderTimeout = setTimeout(() => {
                renderPreview();
                loadingText.style.display = 'none';
            }, 50);
        }

        document.getElementById('upload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                const img = new Image();
                img.onload = () => {
                    sourceImg = img;
                    triggerRender();
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        });

        function renderPreview() {
            if (!sourceImg) return;
            const maxW = 800;
            let w = sourceImg.width;
            let h = sourceImg.height;
            if (w > maxW) { h = Math.round(h * (maxW / w)); w = maxW; }
            canvas.width = w; canvas.height = h;
            processImage(canvas, w, h, 1);
        }

        // --- 核心：热成像渲染算法 ---
        function processImage(targetCanvas, w, h, scaleFactor) {
            const targetCtx = targetCanvas.getContext('2d');
            targetCanvas.width = w; targetCanvas.height = h;

            // 1. 获取 LUT 数据
            const lutData = lutCtx.getImageData(0, 0, 256, 1).data;

            // 2. 绘制原图并获取像素
            // 为了模拟热成像的低分辨率感，我们可以不用平滑缩放
            // 但为了美观，我们这里正常绘制
            targetCtx.drawImage(sourceImg, 0, 0, w, h);
            const srcData = targetCtx.getImageData(0, 0, w, h);
            const pixels = srcData.data;

            // 准备参数
            const contrast = parseFloat(ui.contrast.value);
            const offset = parseInt(ui.offset.value);
            const noise = parseInt(ui.noise.value);
            const isolines = parseInt(ui.isolines.value);

            // 3. 像素处理
            for (let i = 0; i < pixels.length; i += 4) {
                const r = pixels[i];
                const g = pixels[i+1];
                const b = pixels[i+2];

                // 计算灰度 (亮度) -> 模拟温度
                // 使用感知亮度公式: 0.299R + 0.587G + 0.114B
                let gray = 0.299 * r + 0.587 * g + 0.114 * b;

                // 应用对比度和偏移
                // gray = (gray - 128) * contrast + 128 + offset;
                gray = (gray * contrast) + offset;

                // 添加噪点 (模拟传感器热噪)
                if (noise > 0) {
                    gray += (Math.random() - 0.5) * noise;
                }

                // 限制在 0-255
                gray = Math.max(0, Math.min(255, gray));

                // 映射到 LUT 颜色
                const lutIndex = Math.floor(gray) * 4;
                
                // 处理等温线 (Isolines)
                // 如果灰度值处于某些特定区间，强制变成白色或黑色
                let isIso = false;
                if (isolines > 0) {
                    const step = 255 / (isolines + 1);
                    // 检查是否接近某个台阶
                    if (gray % step < 2 * scaleFactor) { 
                        // isIso = true; 
                    }
                }

                if (isIso) {
                    pixels[i] = 255;   // R
                    pixels[i+1] = 255; // G
                    pixels[i+2] = 255; // B
                } else {
                    pixels[i] = lutData[lutIndex];     // R
                    pixels[i+1] = lutData[lutIndex+1]; // G
                    pixels[i+2] = lutData[lutIndex+2]; // B
                }
                // Alpha 不变
            }

            // 写回处理后的像素
            targetCtx.putImageData(srcData, 0, 0);

            // 4. 应用后处理：镜头模糊 (模拟红外光散射)
            const blurAmount = parseInt(ui.blur.value);
            if (blurAmount > 0) {
                // 保存当前画面
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = w; tempCanvas.height = h;
                tempCanvas.getContext('2d').putImageData(srcData, 0, 0);
                
                // 叠加模糊层
                targetCtx.globalCompositeOperation = 'screen'; // 滤色模式让光晕更亮
                targetCtx.filter = `blur(${blurAmount * scaleFactor}px)`;
                targetCtx.globalAlpha = 0.6; // 模糊层透明度
                targetCtx.drawImage(tempCanvas, 0, 0);
                
                // 恢复设置
                targetCtx.filter = 'none';
                targetCtx.globalAlpha = 1.0;
                targetCtx.globalCompositeOperation = 'source-over';
            }
            
            // 5. 绘制等温线 (更清晰的绘制方法)
            if (isolines > 0) {
                // 使用阈值法模拟等温线有点复杂，这里我们用Posterization模拟分层感
                // 这里为了性能和效果，我们简单地不进行二次处理，
                // 上面的像素循环里已经有了基础的颜色映射。
                // 真正的矢量等温线需要 Marching Squares 算法，对于前端 JS 稍微重了点。
                // 我们可以用一个简化的“色阶分离”效果来替代等温线视觉
            }
        }

        // 高清导出
        function downloadImage() {
            if (!sourceImg) return alert("请先载入图片！");
            
            const multiplier = parseInt(document.getElementById('exportSize').value);
            loadingText.innerText = 'Rendering High-Res...';
            loadingText.style.display = 'block';

            setTimeout(() => {
                const targetW = sourceImg.width * multiplier;
                const targetH = sourceImg.height * multiplier;
                
                const offCanvas = document.createElement('canvas');
                processImage(offCanvas, targetW, targetH, multiplier);

                const link = document.createElement('a');
                link.download = `thermal-vision-${multiplier}x.jpg`;
                link.href = offCanvas.toDataURL('image/jpeg', 0.92);
                link.click();

                loadingText.style.display = 'none';
            }, 100);
        }
        
        // 初始化 LUT
        updateLUT();

    </script>

<script src="../lab-export.js"></script>
<script>
  // COOLINGDOWN LAB 统一导出
  LabExport.setup({
    name: 'thermal-vision', ready: () => !!sourceImg,
    image: Object.assign(LabExport.fromSelect('exportSize', () => downloadImage()), { default: '2' }),
    hide: [() => { const e = document.querySelector('#exportSize'); return e && e.parentElement.parentElement; }]
  });
</script>
