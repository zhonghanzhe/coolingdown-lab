<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 风格图片编辑器 - Glitch & Mosaic</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-color: #1e1e1e;
            --accent-color: #00e5ff;
            --text-color: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-color);
            text-shadow: 2px 2px 0px #ff0055;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px;
            width: 90%;
            max-width: 1000px;
        }

        .canvas-wrapper {
            background-color: #000;
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.1);
            max-width: 100%;
            overflow: auto;
            display: flex;
            justify-content: center;
        }

        canvas {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .controls {
            background-color: var(--panel-color);
            padding: 20px;
            border-radius: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            border: 1px solid #333;
        }

        button, .file-upload {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        /* 按钮风格 */
        .btn-primary { background-color: var(--accent-color); color: #000; }
        .btn-primary:hover { box-shadow: 0 0 15px var(--accent-color); }

        .btn-effect { background-color: #333; color: white; border: 1px solid #555; }
        .btn-effect:hover { background-color: #444; border-color: #fff; }

        .btn-danger { background-color: #ff2a6d; color: white; }
        .btn-danger:hover { box-shadow: 0 0 15px #ff2a6d; }

        input[type="file"] { display: none; }
        
        .loading { font-size: 0.8rem; color: #888; margin-top: 5px; display: none;}
    </style>
</head>
<body>

    <h1>Cyber Image Lab</h1>

    <div class="container">
        <div class="controls">
            <label class="btn-primary file-upload">
                📂 上传图片
                <input type="file" id="uploadInput" accept="image/*">
            </label>
            
            <button class="btn-effect" onclick="applyMosaic()">👾 马赛克 (Mosaic)</button>
            <button class="btn-effect" onclick="applyGlitch()">⚡ 故障风 (Glitch)</button>
            <button class="btn-effect" onclick="applyGrayscale()">🌑 高冷黑白</button>
            
            <button class="btn-danger" onclick="resetImage()">🔄 重置</button>
            <button class="btn-primary" onclick="downloadImage()">💾 下载</button>
        </div>
        
        <div class="loading" id="msg">处理中...</div>

        <div class="canvas-wrapper">
            <canvas id="editorCanvas"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('editorCanvas');
        const ctx = canvas.getContext('2d');
        const uploadInput = document.getElementById('uploadInput');
        const msg = document.getElementById('msg');
        
        let originalImage = null; // 保存原图用于重置

        // 1. 图片上传处理
        uploadInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    // 设置画布尺寸
                    canvas.width = img.width;
                    canvas.height = img.height;
                    
                    // 限制过大图片的显示尺寸（优化性能）
                    if(img.width > 1920) {
                       // 实际项目中可以做缩放处理，这里保留原尺寸
                    }

                    ctx.drawImage(img, 0, 0);
                    originalImage = img; // 备份
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        // 2. 马赛克效果算法
        function applyMosaic() {
            if (!originalImage) return alert("请先上传图片！");
            
            // 重新绘制原图作为基础
            ctx.drawImage(originalImage, 0, 0);
            
            const size = 20; // 马赛克块的大小
            const w = canvas.width;
            const h = canvas.height;

            // 获取像素数据
            // 注意：为了性能，这里我们不遍历每个像素，而是遍历每个块
            for (let y = 0; y < h; y += size) {
                for (let x = 0; x < w; x += size) {
                    // 获取当前块中心点的颜色
                    const pixelData = ctx.getImageData(x + Math.floor(size/2), y + Math.floor(size/2), 1, 1).data;
                    
                    // 用该颜色填充整个块
                    ctx.fillStyle = `rgb(${pixelData[0]}, ${pixelData[1]}, ${pixelData[2]})`;
                    ctx.fillRect(x, y, size, size);
                }
            }
        }

        // 3. 故障风格 (Glitch) 算法
        function applyGlitch() {
            if (!originalImage) return alert("请先上传图片！");
            
            // 每次点击都在当前基础上Glitch，或者先重置再Glitch，这里选择基于当前画面叠加
            const w = canvas.width;
            const h = canvas.height;
            const maxOffset = 30; // 最大偏移量
            const iterations = 10; // 切割条数

            for (let i = 0; i < iterations; i++) {
                const startY = Math.random() * h;
                const sliceHeight = Math.random() * 50 + 5;
                const offsetX = (Math.random() - 0.5) * maxOffset * 2;

                // 抓取一部分图像
                const sliceData = ctx.getImageData(0, startY, w, sliceHeight);
                // 错位放回去
                ctx.putImageData(sliceData, offsetX, startY);
            }

            // RGB 色彩分离效果 (简单的颜色偏移)
            ctx.globalCompositeOperation = 'screen'; // 混合模式
            ctx.fillStyle = 'rgba(255, 0, 0, 0.2)';
            ctx.fillRect(Math.random() * w, 0, 5, h); // 随机添加红色竖条
            ctx.globalCompositeOperation = 'source-over'; // 恢复默认
        }

        // 4. 黑白滤镜
        function applyGrayscale() {
            if (!originalImage) return alert("请先上传图片！");
            ctx.drawImage(originalImage, 0, 0);

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;

            for (let i = 0; i < data.length; i += 4) {
                const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
                data[i] = avg;     // R
                data[i + 1] = avg; // G
                data[i + 2] = avg; // B
                // data[i+3] 是 Alpha 通道，不动
            }
            ctx.putImageData(imageData, 0, 0);
        }

        // 重置
        function resetImage() {
            if (originalImage) {
                ctx.drawImage(originalImage, 0, 0);
            }
        }

        // 下载
        function downloadImage() {
            if (!originalImage) return;
            const link = document.createElement('a');
            link.download = 'cyber-edit-result.png';
            link.href = canvas.toDataURL();
            link.click();
        }
    </script>

<script src="../lab-export.js"></script>
<script>
  // COOLINGDOWN LAB 统一导出
  LabExport.setup({
    name: 'glitch-mosaic', ready: () => !!originalImage,
    image: Object.assign(LabExport.pixelCanvas(() => canvas), { note: '“像素放大”用最近邻插值，像素边缘保持锐利。PNG 无损，适合继续在 PS / AI 里编辑。' }),
    hide: ['[onclick="downloadImage()"]']
  });
</script>
