<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII-LIVE ULTRA: 视频录制版</title>
    <style>
        :root {
            --bg: #050505; --panel: #111; --text: #ddd; --accent: #00ff9d;
            --s-col: #ff0055; --m-col: #00ccff; --h-col: #ffe600;
            --rec-col: #ff3b30;
        }
        body {
            font-family: 'Segoe UI', monospace; background-color: var(--bg); color: var(--text);
            margin: 0; padding: 0; display: flex; height: 100vh; overflow: hidden;
        }
        
        /* 左侧控制台 */
        .controls {
            width: 340px; background: var(--panel); border-right: 1px solid #333;
            display: flex; flex-direction: column; overflow-y: auto; padding: 20px;
            box-shadow: 5px 0 20px rgba(0,0,0,0.5); z-index: 10;
        }
        
        h1 { margin: 0 0 20px 0; font-size: 1.2rem; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; }
        
        .group { border-bottom: 1px solid #222; padding-bottom: 15px; margin-bottom: 15px; }
        .group h3 { font-size: 0.9rem; margin: 0 0 10px 0; opacity: 0.8; }
        
        /* 颜色标记 */
        .title-s { color: var(--s-col); } .title-m { color: var(--m-col); } .title-h { color: var(--h-col); }

        label { display: flex; justify-content: space-between; font-size: 0.8rem; color: #888; margin-bottom: 5px; }
        input[type=range], select, input[type=text], input[type=color] {
            width: 100%; background: #000; border: 1px solid #333; color: #fff; 
            padding: 6px; margin-bottom: 8px; border-radius: 4px; box-sizing: border-box;
        }
        input[type=range] { padding: 0; height: 5px; accent-color: var(--accent); }

        /* 按钮通用 */
        .btn {
            padding: 12px; text-align: center; cursor: pointer; font-weight: bold; display: block;
            margin-bottom: 10px; transition: 0.2s; border-radius: 4px; font-size: 0.9rem;
        }

        .btn-file {
            background: #222; color: var(--accent); border: 1px solid var(--accent);
        }
        .btn-file:hover { background: var(--accent); color: #000; }
        input[type="file"] { display: none; }

        /* 录制按钮 */
        .rec-box {
            border: 1px solid #333; background: #000; padding: 10px; border-radius: 8px; margin-top: 20px;
        }
        .btn-rec-start {
            background: #222; color: var(--rec-col); border: 1px solid var(--rec-col);
        }
        .btn-rec-start:hover { background: var(--rec-col); color: #fff; }

        .btn-rec-stop {
            background: var(--rec-col); color: #fff; border: 1px solid var(--rec-col);
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

        /* 右侧画布区 */
        .stage {
            flex: 1; display: flex; justify-content: center; align-items: center;
            background: #000; position: relative;
            background-image: radial-gradient(#1a1a1a 1px, transparent 1px);
            background-size: 20px 20px;
        }
        canvas {
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            max-width: 95%; max-height: 95%;
        }
        
        /* 录制状态指示器 */
        .recording-indicator {
            position: absolute; top: 20px; right: 20px;
            display: flex; align-items: center; gap: 10px;
            background: rgba(0,0,0,0.8); padding: 8px 15px; border-radius: 20px;
            border: 1px solid var(--rec-col); color: var(--rec-col); font-weight: bold;
            display: none; /* 默认隐藏 */
        }
        .rec-dot {
            width: 10px; height: 10px; background: var(--rec-col); border-radius: 50%;
        }

        .fps { position: absolute; bottom: 10px; right: 10px; color: #444; font-size: 12px; font-family: monospace;}
    </style>
</head>
<body>

    <div class="controls">
        <h1>ASCII-LIVE <span style="font-size:0.6em; color:#fff;">ULTRA</span></h1>
        
        <label class="btn btn-file">
            📂 载入图片启动 (START)
            <input type="file" id="upload" accept="image/*">
        </label>

        <div class="group">
            <h3>⚙️ 全局参数 (Global)</h3>
            <label>密度 (Density): <span id="v-res">100</span></label>
            <input type="range" id="res" min="40" max="160" value="100">
            <label>动画速度 (Speed):</label>
            <input type="range" id="speed" min="0" max="20" value="5">
            <label>背景颜色 (BG Color):</label>
            <input type="color" id="bgCol" value="#000000">
        </div>

        <div class="group">
            <h3>🎚️ 阈值分区 (Thresholds)</h3>
            <label>暗部/中间调 分界: <span id="v-th1">60</span></label>
            <input type="range" id="th1" min="0" max="255" value="60">
            <label>中间调/亮部 分界: <span id="v-th2">180</span></label>
            <input type="range" id="th2" min="0" max="255" value="180">
        </div>

        <div class="group" style="border-left: 3px solid var(--s-col); padding-left: 10px;">
            <h3 class="title-s">暗部 (Shadows)</h3>
            <select id="s_char_mode">
                <option value="empty">空 (透明)</option>
                <option value="blocks">█ 实心块</option>
                <option value="simple">. : 简单点</option>
                <option value="custom">自定义 (Custom)</option>
            </select>
            <input type="text" id="s_custom" value="░" placeholder="输入字符...">
            <select id="s_col_mode">
                <option value="fixed">🟥 固定颜色</option>
                <option value="cycle">🌈 动态呼吸 (Live)</option>
                <option value="original">🎨 原始色彩</option>
            </select>
            <input type="color" id="s_fix_col" value="#222222">
        </div>

        <div class="group" style="border-left: 3px solid var(--m-col); padding-left: 10px;">
            <h3 class="title-m">中间调 (Midtones)</h3>
            <select id="m_char_mode">
                <option value="matrix" selected>Matrix (半角)</option>
                <option value="standard">标准 ASCII</option>
                <option value="blocks">█ 实心块</option>
                <option value="custom">自定义 (Custom)</option>
            </select>
            <input type="text" id="m_custom" value="+-=*" placeholder="输入字符...">
            <select id="m_col_mode">
                <option value="cycle" selected>🌈 动态呼吸 (Live)</option>
                <option value="fixed">🟩 固定颜色</option>
                <option value="original">🎨 原始色彩</option>
            </select>
            <input type="color" id="m_fix_col" value="#00ff00">
        </div>

        <div class="group" style="border-left: 3px solid var(--h-col); padding-left: 10px;">
            <h3 class="title-h">亮部 (Highlights)</h3>
            <select id="h_char_mode">
                <option value="custom" selected>自定义 (Custom)</option>
                <option value="blocks">█ 实心块</option>
                <option value="matrix">Matrix</option>
                <option value="standard">标准 ASCII</option>
            </select>
            <input type="text" id="h_custom" value="⚡✨★" placeholder="输入字符...">
            <select id="h_col_mode">
                <option value="fixed" selected>🟨 固定颜色</option>
                <option value="cycle">🌈 动态呼吸 (Live)</option>
                <option value="original">🎨 原始色彩</option>
            </select>
            <input type="color" id="h_fix_col" value="#ffffff">
        </div>
        
        <button class="btn btn-file" onclick="saveSnapshot()">📷 截图 (Snapshot)</button>

        <div class="rec-box">
            <h3 style="margin:0 0 10px 0; color:#fff;">🎥 视频录制 (Video)</h3>
            <button class="btn btn-rec-start" id="btnStartRec" onclick="startRecording()">🔴 开始录制 (REC)</button>
            <button class="btn btn-rec-stop" id="btnStopRec" onclick="stopRecording()" style="display:none;">⏹ 停止并保存</button>
            <div style="font-size:0.8rem; color:#666; text-align:center;">
                格式: WebM (高清)<br>
                提示: 录制5-10秒即可
            </div>
        </div>
    </div>

    <div class="stage">
        <canvas id="displayCanvas"></canvas>
        <div class="recording-indicator" id="recIndicator">
            <div class="rec-dot"></div>
            <span id="recTimer">00:00</span>
        </div>
        <div class="fps">Ready to Record.</div>
    </div>
    
    <canvas id="bufferCanvas" style="display:none;"></canvas>

    <script>
        const displayCanvas = document.getElementById('displayCanvas');
        const ctx = displayCanvas.getContext('2d');
        const bufferCanvas = document.getElementById('bufferCanvas');
        const bCtx = bufferCanvas.getContext('2d', { willReadFrequently: true });
        
        let sourceImg = null;
        let animationId;
        let time = 0;

        // 录制相关变量
        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;
        let startTime = 0;
        let timerInterval;

        const CHAR_SETS = {
            matrix: 'ﾊﾐﾋｰ. :|=+',
            standard: '@%#*+=-:. ',
            blocks: '█▓▒░',
            simple: '. : ',
            empty: ' '
        };

        const ui = {
            res: document.getElementById('res'),
            speed: document.getElementById('speed'),
            bgCol: document.getElementById('bgCol'),
            th1: document.getElementById('th1'),
            th2: document.getElementById('th2'),
            // Shadows
            s_char_m: document.getElementById('s_char_mode'),
            s_custom: document.getElementById('s_custom'),
            s_col_m: document.getElementById('s_col_mode'),
            s_fix_col: document.getElementById('s_fix_col'),
            // Mids
            m_char_m: document.getElementById('m_char_mode'),
            m_custom: document.getElementById('m_custom'),
            m_col_m: document.getElementById('m_col_mode'),
            m_fix_col: document.getElementById('m_fix_col'),
            // Highs
            h_char_m: document.getElementById('h_char_mode'),
            h_custom: document.getElementById('h_custom'),
            h_col_m: document.getElementById('h_col_mode'),
            h_fix_col: document.getElementById('h_fix_col'),
        };

        ui.res.oninput = e => document.getElementById('v-res').innerText = e.target.value;
        ui.th1.oninput = e => document.getElementById('v-th1').innerText = e.target.value;
        ui.th2.oninput = e => document.getElementById('v-th2').innerText = e.target.value;

        document.getElementById('upload').onchange = e => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = evt => {
                sourceImg = new Image();
                sourceImg.onload = startEngine;
                sourceImg.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        };

        function startEngine() {
            if (animationId) cancelAnimationFrame(animationId);
            loop();
        }

        function getChars(mode, customInput) {
            if (mode === 'custom') return customInput.value || '?';
            return CHAR_SETS[mode];
        }

        function getColor(mode, fixedHex, originalRGB, timeOffset) {
            if (mode === 'original') return `rgb(${originalRGB.r},${originalRGB.g},${originalRGB.b})`;
            if (mode === 'fixed') return fixedHex;
            if (mode === 'cycle') {
                const hue = (time * 20 + timeOffset) % 360;
                return `hsl(${hue}, 80%, 60%)`;
            }
            return '#fff';
        }

        function loop() {
            const density = parseInt(ui.res.value);
            const speed = parseInt(ui.speed.value);
            const bgColor = ui.bgCol.value;
            const th1 = parseInt(ui.th1.value);
            const th2 = parseInt(ui.th2.value);

            time += speed * 0.1; 

            const scale = density / sourceImg.width;
            const w = density;
            const h = Math.floor(sourceImg.height * scale * 0.55); 

            const renderScale = 12 * (window.__labS || 1); // LAB 导出：高清倍数
            displayCanvas.width = w * renderScale * 0.6; 
            displayCanvas.height = h * renderScale; 
            
            bufferCanvas.width = w;
            bufferCanvas.height = h;
            bCtx.drawImage(sourceImg, 0, 0, w, h);
            const imgData = bCtx.getImageData(0, 0, w, h).data;

            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, displayCanvas.width, displayCanvas.height);
            ctx.font = `bold ${renderScale}px "Courier New", monospace`;
            ctx.textBaseline = 'top';

            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const i = (y * w + x) * 4;
                    const r = imgData[i];
                    const g = imgData[i+1];
                    const b = imgData[i+2];
                    const avg = (r + g + b) / 3;

                    let zone = 's';
                    if (avg > th2) zone = 'h';
                    else if (avg > th1) zone = 'm';

                    const charMode = ui[`${zone}_char_m`].value;
                    const colMode = ui[`${zone}_col_m`].value;
                    
                    if (charMode === 'empty') continue;

                    const chars = getChars(charMode, ui[`${zone}_custom`]);
                    let charIndex = 0;
                    
                    if (zone === 's') charIndex = Math.floor((avg / th1) * (chars.length - 1));
                    else if (zone === 'm') charIndex = Math.floor(((avg - th1) / (th2 - th1)) * (chars.length - 1));
                    else charIndex = Math.floor(((avg - th2) / (255 - th2)) * (chars.length - 1));
                    
                    const char = chars[Math.max(0, Math.min(chars.length-1, charIndex))];
                    const offset = zone === 's' ? 0 : (zone === 'm' ? 120 : 240);
                    ctx.fillStyle = getColor(colMode, ui[`${zone}_fix_col`].value, {r,g,b}, offset);

                    ctx.fillText(char, x * renderScale * 0.6, y * renderScale);
                }
            }

            animationId = requestAnimationFrame(loop);
        }
        
        // ==========================================
        // 核心：视频录制功能 (MediaRecorder)
        // ==========================================
        function startRecording() {
            if (!sourceImg) return alert("请先载入图片！");

            const stream = displayCanvas.captureStream(30); // 30 FPS 捕获
            const mimeOptions = [
                'video/webm; codecs=vp9',
                'video/webm; codecs=vp8',
                'video/webm'
            ];
            
            let selectedMime = mimeOptions.find(mime => MediaRecorder.isTypeSupported(mime)) || '';

            if (!selectedMime) {
                return alert("您的浏览器不支持 WebM 录制，请使用 Chrome/Edge/Firefox。");
            }

            recordedChunks = [];
            mediaRecorder = new MediaRecorder(stream, {
                mimeType: selectedMime,
                videoBitsPerSecond: 5000000 // 5Mbps 高码率
            });

            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = saveVideo;

            mediaRecorder.start();
            isRecording = true;
            
            // UI 更新
            document.getElementById('btnStartRec').style.display = 'none';
            document.getElementById('btnStopRec').style.display = 'block';
            document.getElementById('recIndicator').style.display = 'flex';
            
            // 计时器
            startTime = Date.now();
            timerInterval = setInterval(() => {
                const diff = Math.floor((Date.now() - startTime) / 1000);
                const m = String(Math.floor(diff / 60)).padStart(2, '0');
                const s = String(diff % 60).padStart(2, '0');
                document.getElementById('recTimer').innerText = `${m}:${s}`;
            }, 1000);
        }

        function stopRecording() {
            if (!isRecording) return;
            mediaRecorder.stop();
            isRecording = false;
            
            // UI 恢复
            document.getElementById('btnStartRec').style.display = 'block';
            document.getElementById('btnStopRec').style.display = 'none';
            document.getElementById('recIndicator').style.display = 'none';
            clearInterval(timerInterval);
            document.getElementById('recTimer').innerText = "00:00";
        }

        function saveVideo() {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = `ascii-live-video-${Date.now()}.webm`;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
        }

        function saveSnapshot() {
            if (!sourceImg) return;
            const link = document.createElement('a');
            link.download = 'ascii-live-snapshot.png';
            link.href = displayCanvas.toDataURL();
            link.click();
        }
    </script>

<script src="../lab-export.js"></script>
<script>
  // COOLINGDOWN LAB 统一导出
  LabExport.setup({
    name: 'ascii-live', ready: () => !!sourceImg,
    image: LabExport.animatedScale(() => displayCanvas, [1, 2, 4]),
    video: { source: () => displayCanvas },
    hide: ['[onclick="saveSnapshot()"]', '.rec-box']
  });
</script>

</body>
</html>
