<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPECTRAL-RISO: 印刷级输出版 (布局修复)</title>
    <style>
        :root {
            --bg: #111; --panel: #1a1a1a; --text: #eee;
            --c: #00ffff; --m: #ff00ff; --y: #ffff00; --k: #ffffff;
        }
        body {
            font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text);
            margin: 0; padding: 20px;
            /* 关键修改：取消 flex 垂直居中，改为自然流 */
            display: block; 
            min-height: 100vh;
        }
        h1 {
            font-weight: 900; text-transform: uppercase; letter-spacing: 4px; margin: 0 auto 30px auto;
            background: linear-gradient(90deg, var(--c), var(--m), var(--y)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-align: center; /* 标题居中 */
        }
        
        .main-layout { 
            display: flex; 
            gap: 30px; 
            width: 100%; 
            max-width: 1400px; 
            margin: 0 auto; /* 容器水平居中 */
            align-items: flex-start; /* 顶部对齐 */
            flex-wrap: wrap; /* 允许换行 */
            justify-content: center; /* 内容在容器内居中 */
        }

        .controls {
            width: 320px; 
            background: var(--panel); padding: 25px; border-radius: 12px; border: 1px solid #333;
            display: flex; flex-direction: column; gap: 20px;
            flex-shrink: 0; /* 防止控制面板被压缩 */
        }

        .canvas-wrapper {
            flex: 1; /* 占据剩余空间 */
            min-width: 300px; /* 最小宽度 */
            max-width: 1000px; /* 限制最大宽度防止过大 */
            background: #fff; padding: 20px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5); 
            display: flex; justify-content: center; align-items: center; 
            overflow: hidden; border-radius: 4px;
            position: relative;
            /* 保证在内容很少时也有一定高度 */
            min-height: 400px; 
        }
        canvas { max-width: 100%; height: auto; display: block; filter: contrast(110%) brightness(95%); }

        /* 以下是原来的控件样式，保持不变 */
        .control-group { border-left: 3px solid #555; padding-left: 15px; }
        .group-c { border-color: var(--c); } .group-m { border-color: var(--m); } .group-y { border-color: var(--y); } .group-k { border-color: var(--k); }
        h3 { margin: 0 0 10px 0; font-size: 0.9rem; color: #888; text-transform: uppercase; }
        label { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 5px; color: #ccc; }
        input[type="range"] { width: 100%; height: 4px; background: #333; border-radius: 2px; cursor: pointer; accent-color: #fff; }
        .range-c { accent-color: var(--c) !important; } .range-m { accent-color: var(--m) !important; } .range-y { accent-color: var(--y) !important; }
        
        button, .file-upload, select {
            padding: 12px; border: 1px solid #444; background: #222; color: #fff; font-weight: bold;
            text-transform: uppercase; cursor: pointer; text-align: center; border-radius: 6px; transition: 0.2s; box-sizing: border-box;
        }
        .btn-main { background: #fff; color: #000; border: none; width: 100%; }
        .btn-main:hover { transform: scale(1.02); box-shadow: 0 0 15px rgba(255,255,255,0.3); }
        
        .export-section { display: flex; gap: 10px; }
        .export-section select { flex: 1; }
        .export-section button { flex: 2; background: var(--accent); color: #000; border: none; }
        
        input[type="file"] { display: none; }
        
        #loadingOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); color: #fff; display: none;
            justify-content: center; align-items: center; flex-direction: column; z-index: 10;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid var(--c);
            border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <h1>Spectral Riso <span style="font-size:0.5em">/// PRINT-READY</span></h1>

    <div class="main-layout">
        <div class="controls">
            <label class="file-upload btn-main">
                📂 载入图片 (Load Image)
                <input type="file" id="upload" accept="image/*">
            </label>

            <div class="control-group group-k">
                <h3>🖨️ 网点设置 (Halftone)</h3>
                <label>点阵大小 (Dot Size) <span id="v-size">8</span></label>
                <input type="range" id="dotSize" min="3" max="30" value="8">
                <label>纸张颜色 (Paper)</label>
                <select id="paperColor" style="width:100%;">
                    <option value="#ffffff">纯白 (White)</option>
                    <option value="#f4f1ea">米黄 (Cream)</option>
                    <option value="#222222">深灰 (Dark Grey)</option>
                </select>
            </div>

            <div class="control-group group-c">
                <h3 style="color:var(--c)">Cyan (青色通道)</h3>
                <label>X 偏移 <span id="v-cx">-10</span></label> <input type="range" class="range-c" id="cx" min="-60" max="60" value="-10">
                <label>Y 偏移 <span id="v-cy">0</span></label> <input type="range" class="range-c" id="cy" min="-60" max="60" value="0">
            </div>
            <div class="control-group group-m">
                <h3 style="color:var(--m)">Magenta (品红通道)</h3>
                <label>X 偏移 <span id="v-mx">10</span></label> <input type="range" class="range-m" id="mx" min="-60" max="60" value="10">
                <label>Y 偏移 <span id="v-my">0</span></label> <input type="range" class="range-m" id="my" min="-60" max="60" value="0">
            </div>
            <div class="control-group group-y">
                <h3 style="color:var(--y)">Yellow (黄色通道)</h3>
                <label>X 偏移 <span id="v-yx">0</span></label> <input type="range" class="range-y" id="yx" min="-60" max="60" value="0">
                <label>Y 偏移 <span id="v-yy">5</span></label> <input type="range" class="range-y" id="yy" min="-60" max="60" value="5">
            </div>

            <div class="control-group group-k" style="border-color: #fff;">
                <h3>💾 印刷级导出 (Print Export)</h3>
                <div class="export-section">
                    <select id="exportSize">
                        <option value="1">1x (预览)</option>
                        <option value="2">2x (高清)</option>
                        <option value="4">4K (超清)</option>
                        <option value="8">8K (印刷)</option>
                    </select>
                    <button class="btn-main" onclick="downloadHighRes()">下载 JPG</button>
                </div>
            </div>
        </div>

        <div class="canvas-wrapper">
            <div id="loadingOverlay">
                <div class="spinner"></div>
                <div id="loadingText">正在渲染高清印刷稿...</div>
            </div>
            <canvas id="canvas"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');
        
        let sourceImg = null;
        let renderTimeout;
        
        const ui = {
            size: document.getElementById('dotSize'),
            paper: document.getElementById('paperColor'),
            cx: document.getElementById('cx'), cy: document.getElementById('cy'),
            mx: document.getElementById('mx'), my: document.getElementById('my'),
            yx: document.getElementById('yx'), yy: document.getElementById('yy'),
        };

        Object.keys(ui).forEach(key => {
            ui[key].addEventListener('input', (e) => {
                const span = document.getElementById(`v-${key}`);
                if(span) span.innerText = e.target.value;
                if(renderTimeout) clearTimeout(renderTimeout);
                renderTimeout = setTimeout(renderPreview, 50);
            });
        });

        document.getElementById('upload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                const img = new Image();
                img.onload = () => {
                    sourceImg = img;
                    renderPreview();
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        });

        // 预览渲染 (固定宽度，快速)
        function renderPreview() {
            if(!sourceImg) return;
            const maxW = 1000;
            let w = sourceImg.width;
            let h = sourceImg.height;
            if(w > maxW) { h = Math.round(h * (maxW / w)); w = maxW; }
            renderToCanvas(canvas, w, h, 1);
        }

        // 核心渲染逻辑
        function renderToCanvas(targetCanvas, w, h, scaleFactor) {
            targetCanvas.width = w;
            targetCanvas.height = h;
            const targetCtx = targetCanvas.getContext('2d');

            targetCtx.fillStyle = ui.paper.value;
            targetCtx.fillRect(0, 0, w, h);

            const offCanvas = document.createElement('canvas');
            offCanvas.width = w; offCanvas.height = h;
            const offCtx = offCanvas.getContext('2d');
            offCtx.drawImage(sourceImg, 0, 0, w, h);
            const imgData = offCtx.getImageData(0, 0, w, h).data;

            const baseDotSize = parseInt(ui.size.value);
            const dotSize = Math.max(1, Math.floor(baseDotSize * scaleFactor)); 

            const offsets = {
                c: { x: parseInt(ui.cx.value) * scaleFactor, y: parseInt(ui.cy.value) * scaleFactor },
                m: { x: parseInt(ui.mx.value) * scaleFactor, y: parseInt(ui.my.value) * scaleFactor },
                y: { x: parseInt(ui.yx.value) * scaleFactor, y: parseInt(ui.yy.value) * scaleFactor }
            };

            targetCtx.globalCompositeOperation = 'multiply';

            for (let y = 0; y < h; y += dotSize) {
                for (let x = 0; x < w; x += dotSize) {
                    const sampleX = Math.floor(x);
                    const sampleY = Math.floor(y);
                    const i = (sampleY * w + sampleX) * 4;
                    
                    if (i >= imgData.length) continue;

                    const r = imgData[i]; const g = imgData[i+1]; const b = imgData[i+2];
                    const cVal = 255 - r; const mVal = 255 - g; const yVal = 255 - b;

                    const drawDot = (val, colorStr, offX, offY) => {
                        if (val > 10) {
                            targetCtx.fillStyle = colorStr.replace('%a', val/255);
                            targetCtx.beginPath();
                            const radius = (dotSize/2) * (val/255) * 1.3;
                            targetCtx.arc(x + offX, y + offY, radius, 0, Math.PI*2);
                            targetCtx.fill();
                        }
                    };

                    drawDot(cVal, `rgba(0, 255, 255, %a)`, offsets.c.x, offsets.c.y);
                    drawDot(mVal, `rgba(255, 0, 255, %a)`, offsets.m.x, offsets.m.y);
                    drawDot(yVal, `rgba(255, 255, 0, %a)`, offsets.y.x, offsets.y.y);
                }
            }
            targetCtx.globalCompositeOperation = 'source-over';
        }

        // 高清导出
        function downloadHighRes() {
            if(!sourceImg) return alert("请先载入图片！");
            
            const multiplier = parseInt(document.getElementById('exportSize').value);
            loadingText.innerText = `正在渲染 ${multiplier}x 高清印刷稿...`;
            loadingOverlay.style.display = 'flex';

            setTimeout(() => {
                const targetW = sourceImg.width * multiplier;
                const targetH = sourceImg.height * multiplier;
                const previewW = canvas.width;
                const scaleFactor = targetW / previewW;

                const offCanvas = document.createElement('canvas');
                renderToCanvas(offCanvas, targetW, targetH, scaleFactor);

                const link = document.createElement('a');
                link.download = `spectral-riso-${multiplier}x-print.jpg`;
                link.href = offCanvas.toDataURL('image/jpeg', 0.95);
                link.click();

                loadingOverlay.style.display = 'none';
            }, 100);
        }
    </script>

<script src="../lab-export.js"></script>
<script>
  // COOLINGDOWN LAB 统一导出
  LabExport.setup({
    name: 'spectral-riso', ready: () => !!sourceImg,
    image: Object.assign(LabExport.fromSelect('exportSize', () => downloadHighRes()), { default: '2' }),
    hide: [() => { const e = document.querySelector('#exportSize'); return e && e.closest('.control-group'); }]
  });
</script>
