<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COOLINGDOWN LAB · 图像实验室</title>
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;1,300&family=Redaction+70&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f8f8f6; --fg:#111110; --dim:#6e6e68; --line:#d8d8d4; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--fg);
    font-family:"IBM Plex Mono","SF Mono",ui-monospace,Menlo,"PingFang SC",monospace; min-height:100vh;
    -webkit-font-smoothing:antialiased; }
  a { color:inherit; }

  header { position:relative; overflow:hidden; min-height:88vh; padding:56px 40px 28px; border-bottom:1px solid var(--line);
    display:flex; flex-wrap:wrap; align-items:flex-end; align-content:flex-end; justify-content:space-between; gap:24px; }
  header > :not(#swirl) { position:relative; z-index:1; }
  #swirl { position:absolute; inset:0; width:100%; height:100%; display:block; pointer-events:none;
    -webkit-mask-image:linear-gradient(to bottom,#000 94%,transparent); mask-image:linear-gradient(to bottom,#000 94%,transparent); }
  h1 { font-size:clamp(44px,8vw,112px); line-height:.95; letter-spacing:-.02em; font-weight:300; }
  h1 .word { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
  h1 #sub { display:block; font-size:.2em; letter-spacing:.35em; font-weight:400; color:var(--dim); margin-top:18px; }
  .meta { color:var(--dim); font-size:12px; line-height:1.8; text-align:right; }
  .meta b { color:var(--fg); font-weight:500; }

  nav { position:sticky; top:0; z-index:5; display:flex; gap:6px; padding:14px 40px;
    background:rgba(248,248,246,.85); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line); }
  nav button { font:inherit; font-size:12px; letter-spacing:.12em; color:var(--dim); background:none;
    border:1px solid var(--line); padding:7px 14px; border-radius:999px; cursor:pointer; transition:.2s; }
  nav button:hover { color:var(--fg); border-color:#999; }
  nav button.on { color:var(--bg); background:var(--fg); border-color:var(--fg); }
  nav button i { font-style:normal; opacity:.55; margin-left:6px; }

  main { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:1px; padding:1px 0;
    border-bottom:1px solid var(--line); }
  .card { background:var(--bg); outline:1px solid var(--line); display:flex; flex-direction:column; position:relative; }
  .card[hidden] { display:none; }
  .thumb { display:block; aspect-ratio:16/10; overflow:hidden; background:#000; position:relative; }
  .thumb canvas { width:100%; height:100%; display:block; transition:transform .5s ease; }
  .card:hover .thumb canvas { transform:scale(1.04); }
  .thumb .cat { position:absolute; left:12px; top:12px; font-size:10px; letter-spacing:.2em; color:#f2f2f2;
    padding:4px 8px; background:rgba(0,0,0,.6); border:1px solid rgba(255,255,255,.2); border-radius:3px; }
  .body { padding:18px 20px 20px; display:flex; flex-direction:column; gap:10px; flex:1; }
  .name { font-size:15px; font-weight:300; font-style:italic; letter-spacing:.01em; text-decoration:none; }
  .name::after { content:""; display:inline-block; width:8px; height:8px; border-radius:50%;
    background:var(--a); margin-left:10px; vertical-align:middle; box-shadow:0 0 10px var(--a); }
  .zh { font-size:13px; font-weight:300; letter-spacing:.12em; margin-top:-6px; }
  .desc { font-size:12.5px; line-height:1.7; color:var(--dim); flex:1; }
  .vers { display:flex; flex-wrap:wrap; gap:6px; }
  .vers a { font-size:11px; letter-spacing:.06em; text-decoration:none; padding:6px 10px;
    border:1px solid var(--line); border-radius:4px; transition:.15s; }
  .vers a:hover { border-color:var(--fg); }
  .vers a:first-child { border-color:var(--fg); }

  footer { padding:28px 40px 40px; color:var(--dim); font-size:11px; letter-spacing:.1em;
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; }

  @media (max-width:600px) {
    header, nav, footer { padding-left:18px; padding-right:18px; }
    .meta { text-align:left; }
  }
</style>
</head>
<body>

<header>
  <canvas id="swirl" aria-hidden="true"></canvas>
  <h1><span class="word">COOLINGDOWN LAB</span><span id="sub">图像实验室 · 图片处理程序合集</span></h1>
  <div class="meta">
    <b id="count"></b><br>
    全部在浏览器本地运行，图片不会上传<br>
    每个工具右下角 ⤓ EXPORT：PNG / JPG 高清 · MP4 / GIF<br>
    Hanzhe Zhong
  </div>
</header>

<nav id="filters"></nav>
<main id="grid"></main>

<footer>
  <span>COOLINGDOWN LAB</span>
  <span>点卡片打开默认版本 · 下面的按钮切换其他版本</span>
</footer>

<script>
const CARDS = /*__DATA__*/[]/*__END__*/;
const CATS = { all:"全部", image:"图像", "3d":"3D", type:"字体" };

/* ---------- 卡片缩略图：每种效果一个小的生成图案 ---------- */
const field = (x, y, t) =>
  Math.sin(x * .045 + t) + Math.sin(y * .06 - t * .7) + Math.sin((x + y) * .028 + t * .5) +
  Math.sin(Math.hypot(x - 160, y - 100) * .05 - t);
const thermalCol = v => {               // v: 0..1
  const stops = [[0,0,40],[60,0,140],[200,0,120],[255,80,0],[255,200,0],[255,255,230]];
  const p = Math.min(.999, Math.max(0, v)) * (stops.length - 1), i = p | 0, f = p - i;
  const a = stops[i], b = stops[i + 1];
  return `rgb(${a.map((c, k) => c + (b[k] - c) * f | 0)})`;
};
const ART = {
  vhs(g, w, h, t, a) {
    const grd = g.createLinearGradient(0, 0, 0, h);
    grd.addColorStop(0, "#1a1030"); grd.addColorStop(.6, a); grd.addColorStop(1, "#200");
    g.fillStyle = grd; g.fillRect(0, 0, w, h);
    for (let y = 0; y < h; y += 3) { g.fillStyle = "rgba(0,0,0,.35)"; g.fillRect(0, y, w, 1); }
    const band = (t * 40) % h;
    g.fillStyle = "rgba(255,255,255,.12)"; g.fillRect(0, band, w, 14);
    g.globalCompositeOperation = "screen";
    g.fillStyle = "#f00"; g.fillRect(w * .3 + 3, h * .3, w * .4, h * .35);
    g.fillStyle = "#0ff"; g.fillRect(w * .3 - 3, h * .3, w * .4, h * .35);
    g.globalCompositeOperation = "source-over";
    g.fillStyle = "#fff"; g.font = "bold 16px monospace";
    g.fillText("PLAY ▶", 18, h - 40);
    g.fillText("00:" + String(12 + (t | 0) % 48).padStart(2, "0") + ":34", 18, h - 18);
  },
  ascii(g, w, h, t, a) {
    g.fillStyle = "#000"; g.fillRect(0, 0, w, h);
    const ch = " .:-=+*#%@"; g.font = "10px monospace"; g.fillStyle = a;
    for (let y = 8; y < h; y += 10) for (let x = 0; x < w; x += 7) {
      const v = (field(x, y, t) + 4) / 8;
      g.fillText(ch[Math.min(9, v * 10 | 0)], x, y);
    }
  },
  riso(g, w, h, t) {
    g.fillStyle = "#f3eee2"; g.fillRect(0, 0, w, h);
    g.globalCompositeOperation = "multiply";
    [["#ff48b0", 0], ["#0078bf", 4]].forEach(([c, o]) => {
      g.fillStyle = c;
      for (let y = 0; y < h; y += 8) for (let x = 0; x < w; x += 8) {
        const v = (field(x + o * 6, y, t + o) + 4) / 8;
        g.beginPath(); g.arc(x + o, y + o, v * 4.6, 0, 7); g.fill();
      }
    });
    g.globalCompositeOperation = "source-over";
  },
  citypop(g, w, h, t, a) {
    const sky = g.createLinearGradient(0, 0, 0, h * .62);
    sky.addColorStop(0, "#1b0a3c"); sky.addColorStop(1, a);
    g.fillStyle = sky; g.fillRect(0, 0, w, h);
    const cx = w / 2, cy = h * .62, r = h * .3;
    const sun = g.createLinearGradient(0, cy - r, 0, cy);
    sun.addColorStop(0, "#ffe66d"); sun.addColorStop(1, "#ff2a6d");
    g.fillStyle = sun; g.beginPath(); g.arc(cx, cy, r, Math.PI, 0); g.fill();
    g.fillStyle = "#1b0a3c";
    for (let i = 0; i < 6; i++) g.fillRect(cx - r, cy - 6 - i * 9, r * 2, 2 + i * .6);
    g.fillStyle = "#0a0420"; g.fillRect(0, cy, w, h - cy);
    g.strokeStyle = "#00ffff"; g.lineWidth = 1;
    for (let i = 0; i < 12; i++) {
      const y = cy + Math.pow((i + (t * .6) % 1) / 12, 2) * (h - cy);
      g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke();
    }
    for (let i = -10; i <= 10; i++) { g.beginPath(); g.moveTo(cx + i * 8, cy); g.lineTo(cx + i * 60, h); g.stroke(); }
  },
  haze(g, w, h, t, a) {
    g.fillStyle = "#0a0010"; g.fillRect(0, 0, w, h);
    g.globalCompositeOperation = "lighter";
    [[a, .3, .4], ["#7a00ff", .7, .55], ["#00e0ff", .5, .25], ["#ffcc00", .2, .8]].forEach(([c, x, y], i) => {
      const px = w * (x + Math.sin(t * .7 + i) * .12), py = h * (y + Math.cos(t * .5 + i * 2) * .15);
      const r = g.createRadialGradient(px, py, 0, px, py, w * .38);
      r.addColorStop(0, c); r.addColorStop(1, "transparent");
      g.fillStyle = r; g.fillRect(0, 0, w, h);
    });
    g.globalCompositeOperation = "source-over";
  },
  contour(g, w, h, t, a) {
    g.fillStyle = "#050505"; g.fillRect(0, 0, w, h);
    for (let y = 0; y < h; y += 3) for (let x = 0; x < w; x += 3) {
      const v = field(x, y, t) * 3;
      if (Math.abs(v - Math.round(v)) < .12) { g.fillStyle = Math.round(v) % 2 ? a : "#fff"; g.fillRect(x, y, 3, 3); }
    }
  },
  thermal(g, w, h, t) {
    for (let y = 0; y < h; y += 5) for (let x = 0; x < w; x += 5) {
      g.fillStyle = thermalCol((field(x, y, t) + 4) / 8); g.fillRect(x, y, 5, 5);
    }
    g.strokeStyle = "rgba(255,255,255,.7)"; g.strokeRect(w / 2 - 18, h / 2 - 18, 36, 36);
    g.fillStyle = "#fff"; g.font = "11px monospace"; g.fillText("36.8°C", w / 2 + 24, h / 2 + 4);
  },
  stretch(g, w, h, t) {
    g.fillStyle = "#000"; g.fillRect(0, 0, w, h);
    const split = w * (.45 + Math.sin(t) * .08);
    for (let x = 0; x < split; x += 4) for (let y = 0; y < h; y += 4) {
      g.fillStyle = thermalCol((field(x, y, 0) + 4) / 10 + .15); g.fillRect(x, y, 4, 4);
    }
    for (let y = 0; y < h; y += 2) {
      g.fillStyle = thermalCol((field(split, y, 0) + 4) / 10 + .15); g.fillRect(split, y, w - split, 2);
    }
  },
  dither(g, w, h, t, a) {
    const B = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
    g.fillStyle = "#000"; g.fillRect(0, 0, w, h); g.fillStyle = a;
    for (let y = 0; y < h; y += 3) for (let x = 0; x < w; x += 3) {
      const v = (field(x, y, t) + 4) / 8, th = (B[((y / 3) % 4) * 4 + (x / 3) % 4] + .5) / 16;
      if (v > th) g.fillRect(x, y, 3, 3);
    }
  },
  glitch(g, w, h, t, a) {
    for (let y = 0; y < h; y += 12) for (let x = 0; x < w; x += 12) {
      g.fillStyle = thermalCol((field(x, y, 0) + 4) / 8 * .8); g.fillRect(x, y, 12, 12);
    }
    let s = (t * 5 | 0) * 9301;
    const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    for (let i = 0; i < 9; i++) {
      const y = rnd() * h, hh = 4 + rnd() * 18, dx = (rnd() - .5) * 60;
      g.drawImage(g.canvas, 0, y * 2, w * 2, hh * 2, dx, y, w, hh);
      if (rnd() > .6) { g.fillStyle = rnd() > .5 ? a : "#ff0055"; g.globalAlpha = .5; g.fillRect(0, y, w, hh); g.globalAlpha = 1; }
    }
  },
  particles(g, w, h, t, a) {
    g.fillStyle = "#000"; g.fillRect(0, 0, w, h); g.fillStyle = a;
    for (let i = 0; i < 900; i++) {
      const p = Math.acos(1 - 2 * (i + .5) / 900), th = Math.PI * (1 + Math.sqrt(5)) * i;
      const r = 1 + .18 * Math.sin(p * 6 + t * 2);
      let x = Math.sin(p) * Math.cos(th) * r, y = Math.cos(p) * r, z = Math.sin(p) * Math.sin(th) * r;
      const c = Math.cos(t * .5), sn = Math.sin(t * .5); [x, z] = [x * c - z * sn, x * sn + z * c];
      const k = 2.6 / (3.2 + z);
      g.globalAlpha = .35 + (1 - z) * .3;
      g.fillRect(w / 2 + x * h * .38 * k, h / 2 + y * h * .38 * k, 1.6, 1.6);
    }
    g.globalAlpha = 1;
  },
  terrain(g, w, h, t, a) {
    g.fillStyle = "#000500"; g.fillRect(0, 0, w, h);
    g.strokeStyle = a; g.lineWidth = 1;
    for (let r = 0; r < 26; r++) {
      const zf = r / 26, z = 1 - zf, y0 = h * .28 + Math.pow(zf, 1.6) * h * .8;
      g.globalAlpha = .25 + zf * .75; g.beginPath();
      for (let c = 0; c <= 40; c++) {
        const u = c / 40 - .5, x = w / 2 + u * w * (.5 + zf * 1.3);
        const ht = (field(c * 9, r * 9 + t * 25, 0) + 4) * (8 + zf * 10);
        c ? g.lineTo(x, y0 - ht) : g.moveTo(x, y0 - ht);
      }
      g.stroke();
    }
    g.globalAlpha = 1;
  },
  type(g, w, h, t, a) {
    g.fillStyle = "#0d0d0d"; g.fillRect(0, 0, w, h);
    g.font = `900 ${h * .62}px Helvetica, Arial, sans-serif`; g.textAlign = "center"; g.textBaseline = "middle";
    for (let y = 0; y < h; y += 6) {
      g.save(); g.beginPath(); g.rect(0, y, w, 6); g.clip();
      const dx = Math.sin(y * .05 + t * 2) * 14;
      g.fillStyle = y % 12 ? "#fff" : a; g.fillText("Aa", w / 2 + dx, h / 2);
      g.restore();
    }
    g.textAlign = "start"; g.textBaseline = "alphabetic";
  },
  chrome(g, w, h, t, a) {
    g.fillStyle = "#000"; g.fillRect(0, 0, w, h);
    g.font = `900 ${h * .72}px Helvetica, Arial, sans-serif`; g.textAlign = "center"; g.textBaseline = "middle";
    const sh = Math.sin(t) * h * .3;
    const m = g.createLinearGradient(0, h * .15 + sh, 0, h * .85 + sh);
    ["#222", "#fff", "#555", a, "#eee", "#111"].forEach((c, i, arr) => m.addColorStop(i / (arr.length - 1), c));
    g.fillStyle = m; g.fillText("Zz", w / 2, h / 2 + 4);
    g.textAlign = "start"; g.textBaseline = "alphabetic";
  },
};

/* ---------- 渲染 ---------- */
const grid = document.getElementById("grid");
document.getElementById("count").textContent =
  `${CARDS.length} 个效果 · ${CARDS.reduce((n, c) => n + c.versions.length, 0)} 个工具`;

const W = 320, H = 200;
CARDS.forEach(c => {
  const el = document.createElement("article");
  el.className = "card"; el.dataset.cat = c.cat; el.style.setProperty("--a", c.accent);
  el.innerHTML = `
    <a class="thumb" href="${encodeURI(c.versions[0].href)}"><canvas width="${W * 2}" height="${H * 2}"></canvas>
      <span class="cat">${CATS[c.cat]}</span></a>
    <div class="body">
      <a class="name" href="${encodeURI(c.versions[0].href)}">${c.name}</a>
      <div class="zh">${c.zh}</div>
      <p class="desc">${c.desc}</p>
      <div class="vers">${c.versions.map(v => `<a href="${encodeURI(v.href)}">${v.label} →</a>`).join("")}</div>
    </div>`;
  grid.appendChild(el);

  const cv = el.querySelector("canvas"), g = cv.getContext("2d");
  g.scale(2, 2);
  const draw = t => ART[c.art](g, W, H, t, c.accent);
  draw(0);
  let raf = 0, t0 = 0;
  const loop = now => { draw((now - t0) / 1000); raf = requestAnimationFrame(loop); };
  el.addEventListener("mouseenter", () => { t0 = performance.now(); raf = requestAnimationFrame(loop); });
  el.addEventListener("mouseleave", () => { cancelAnimationFrame(raf); });
});

/* ---------- 顶部粒子字：平时聚成 COOLINGDOWN LAB，鼠标碰到就散开，近大虚、远小实 ---------- */
(async () => {
  const header = document.querySelector("header"), cv = document.getElementById("swirl");
  const gl = cv.getContext("webgl", { alpha: true, premultipliedAlpha: true, antialias: false });
  if (!gl) return;
  const FONT = '"Redaction 70", Georgia, serif', LINES = ["COOLINGDOWN", "LAB"];
  try { await document.fonts.load(`400 100px "Redaction 70"`, "COOLINGDOWN LAB"); } catch (_) {}

  const VS = `
    precision highp float;
    attribute vec3 pos;
    attribute vec4 look;        // 颜色 rgb, 粒子大小
    uniform vec2 res;
    uniform float dpr;
    varying vec3 vCol; varying float vBlur, vAlpha;
    const float PERSP = 900.0;
    void main() {
      float s = PERSP / (PERSP - min(pos.z, PERSP * 0.8));
      vec2 p = res * 0.5 + (pos.xy - res * 0.5) * s;
      gl_Position = vec4(p.x / res.x * 2.0 - 1.0, 1.0 - p.y / res.y * 2.0, 0.0, 1.0);
      float blur = smoothstep(15.0, 420.0, pos.z);   // 只有靠近屏幕才发虚
      gl_PointSize = clamp(look.a * s * (1.0 + 11.0 * blur), 1.0, 120.0) * dpr;
      vBlur = blur; vCol = look.rgb;
      vAlpha = mix(0.95, 0.16, sqrt(blur));
    }`;
  const FS = `
    precision mediump float;
    varying vec3 vCol; varying float vBlur, vAlpha;
    void main() {
      float d = length(gl_PointCoord - 0.5) * 2.0;
      float al = (1.0 - smoothstep(1.0 - mix(0.3, 1.0, vBlur), 1.0, d)) * vAlpha;
      gl_FragColor = vec4(vCol * al, al);
    }`;
  const sh = (type, src) => { const o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o); return o; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return;
  gl.useProgram(prog);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  gl.clearColor(0, 0, 0, 0);
  const posBuf = gl.createBuffer(), lookBuf = gl.createBuffer();
  const lPos = gl.getAttribLocation(prog, "pos"), lLook = gl.getAttribLocation(prog, "look");
  gl.enableVertexAttribArray(lPos); gl.enableVertexAttribArray(lLook);
  const uRes = gl.getUniformLocation(prog, "res"), uDpr = gl.getUniformLocation(prog, "dpr");

  const PALETTE = [[255,61,142],[255,61,142],[255,92,168],[255,92,168],[255,133,196],[150,84,255],[178,120,255]];
  let N = 0, P, V, home, R, W = 0, H = 0, reach = 120;   // P/V: x y z，home: x y，R: 每个粒子的受力差异

  /* 把字画到离屏画布，再按网格取样得到每个粒子的归位点 */
  const layout = () => {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    gl.viewport(0, 0, cv.width, cv.height);
    gl.uniform2f(uRes, W, H); gl.uniform1f(uDpr, dpr);

    const boxTop = Math.min(...[...header.children].filter(e => e !== cv)
      .map(e => (e.querySelector("#sub") || e).getBoundingClientRect().top)) - header.getBoundingClientRect().top;
    const pad = parseFloat(getComputedStyle(header).paddingLeft);
    const off = document.createElement("canvas"); off.width = W; off.height = H;
    const g = off.getContext("2d", { willReadFrequently: true });
    g.font = `400 100px ${FONT}`;
    const wide = Math.max(...LINES.map(l => g.measureText(l).width));
    const LEAD = .92, size = Math.min((W - pad * 2) / wide * 100, (boxTop - 40) / (LINES.length * LEAD));
    g.font = `400 ${size}px ${FONT}`; g.fillStyle = "#000"; g.textBaseline = "alphabetic";
    LINES.forEach((l, i) => g.fillText(l, pad, boxTop - 28 - (LINES.length - 1 - i) * size * LEAD - size * .08));
    const img = g.getImageData(0, 0, W, H).data;

    const step = Math.max(1.4, size / 85);
    const pts = [];
    for (let y = 0; y < H; y += step) for (let x = 0; x < W; x += step)
      if (img[((y | 0) * W + (x | 0)) * 4 + 3] > 120) pts.push(x + (Math.random() - .5) * step * .3, y + (Math.random() - .5) * step * .3);
    N = pts.length / 2; reach = Math.max(70, size * .75);
    home = new Float32Array(pts);
    P = new Float32Array(N * 3); V = new Float32Array(N * 3); R = new Float32Array(N);
    const look = new Float32Array(N * 4);
    for (let i = 0; i < N; i++) {
      P[i * 3] = Math.random() * W; P[i * 3 + 1] = Math.random() * H; P[i * 3 + 2] = Math.random() * 500 - 150;
      R[i] = Math.random();
      const c = PALETTE[Math.random() * PALETTE.length | 0];
      look.set([c[0] / 255, c[1] / 255, c[2] / 255, step * (1.1 + Math.random() * .5)], i * 4);
    }
    gl.bindBuffer(gl.ARRAY_BUFFER, lookBuf); gl.bufferData(gl.ARRAY_BUFFER, look, gl.STATIC_DRAW);
    gl.vertexAttribPointer(lLook, 4, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, posBuf); gl.bufferData(gl.ARRAY_BUFFER, P, gl.DYNAMIC_DRAW);
    gl.vertexAttribPointer(lPos, 3, gl.FLOAT, false, 0, 0);
  };
  layout();
  let rt = 0;
  addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(layout, 200); });

  /* 鼠标 / 手指 */
  let mx = -1e4, my = -1e4;
  const point = e => { const r = cv.getBoundingClientRect(); mx = e.clientX - r.left; my = e.clientY - r.top; };
  const away = () => { mx = my = -1e4; };
  addEventListener("pointermove", point, { passive: true });
  addEventListener("pointerdown", point, { passive: true });
  addEventListener("pointerup", e => { if (e.pointerType !== "mouse") away(); }, { passive: true });
  addEventListener("pointercancel", away, { passive: true });
  document.addEventListener("pointerleave", away);

  const stepPhysics = t => {
    for (let i = 0, a = 0, h = 0; i < N; i++, a += 3, h += 2) {
      const r = R[i], dx = P[a] - mx, dy = P[a + 1] - my, d2 = dx * dx + dy * dy, far = reach * (.6 + r * .9);
      if (d2 < far * far) {
        const d = Math.sqrt(d2) || 1, f = (1 - d / far) * (.35 + r * r * 1.8), spin = i % 2 ? 2.2 : -2.2, side = i % 5 === 0 ? -.5 : 1;
        V[a] += (dx * 5 - dy * spin) / d * f; V[a + 1] += (dy * 5 + dx * spin) / d * f; V[a + 2] += f * 11 * side;
      }
      /* 归位点带一点缓慢浮动，静止时字也是活的 */
      const hx = home[h] + Math.sin(t * .0011 + i * 1.7) * .9, hy = home[h + 1] + Math.cos(t * .0013 + i * 2.3) * .9;
      const k = .012 + r * .018;
      V[a] += (hx - P[a]) * k; V[a + 1] += (hy - P[a + 1]) * k; V[a + 2] -= P[a + 2] * k;
      V[a] *= .9; V[a + 1] *= .9; V[a + 2] *= .9;
      P[a] += V[a]; P[a + 1] += V[a + 1]; P[a + 2] += V[a + 2];
    }
  };

  let visible = true, raf = 0, last = 0, acc = 0;
  const frame = now => {
    raf = 0;
    if (!visible || document.hidden) return;
    acc = Math.min(acc + (now - last), 50); last = now;
    while (acc >= 16.6) { stepPhysics(now); acc -= 16.6; }   // 高刷屏上物理速度不变
    gl.bindBuffer(gl.ARRAY_BUFFER, posBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, P);
    gl.clear(gl.COLOR_BUFFER_BIT); gl.drawArrays(gl.POINTS, 0, N);
    raf = requestAnimationFrame(frame);
  };
  const kick = () => { if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); } };
  new IntersectionObserver(([e]) => { visible = e.isIntersecting; kick(); }).observe(cv);
  document.addEventListener("visibilitychange", kick);
  kick();
})();

/* ---------- 筛选 ---------- */
const nav = document.getElementById("filters");
Object.entries(CATS).forEach(([k, label]) => {
  const n = k === "all" ? CARDS.length : CARDS.filter(c => c.cat === k).length;
  const b = document.createElement("button");
  b.innerHTML = `${label}<i>${n}</i>`; b.className = k === "all" ? "on" : "";
  b.onclick = () => {
    nav.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    grid.querySelectorAll(".card").forEach(card => card.hidden = k !== "all" && card.dataset.cat !== k);
  };
  nav.appendChild(b);
});
</script>
