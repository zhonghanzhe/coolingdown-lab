<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COOLINGDOWN LAB · 图像实验室</title>
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<style>
  /* 与作品集主页同一套样式（portfolio-site/style.css），只用浅色 */
  :root { --bg:#f8f8f6; --bg-alt:#efefec; --border:#d8d8d4; --text:#111110; --dim:#6e6e68;
    --pad:clamp(20px,5vw,56px); }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:"IBM Plex Mono","SF Mono",ui-monospace,Menlo,"PingFang SC",monospace;
    font-size:13px; line-height:1.6; letter-spacing:.01em; -webkit-font-smoothing:antialiased; overflow-x:clip; }
  a { color:inherit; text-decoration:none; }
  p { margin:0; }

  .tagline { text-align:center; text-transform:uppercase; font-size:clamp(.68rem,1.4vw,.82rem);
    letter-spacing:.05em; line-height:1.9; max-width:860px;
    margin:clamp(28px,5vw,44px) auto clamp(20px,4vw,32px); padding:0 var(--pad); }
  .divider { border-top:1px dotted var(--border); }
  .row { position:sticky; top:0; z-index:100; display:flex; align-items:center; justify-content:space-between;
    gap:1.5rem; flex-wrap:wrap; padding:1rem var(--pad); background:var(--bg);
    border-bottom:1px solid transparent; transition:border-color .3s ease; }
  .row.scrolled { border-bottom-color:var(--border); }
  .wordmark-name { display:flex; align-items:baseline; gap:.9rem; flex-wrap:wrap; }
  .wordmark { font-weight:300; font-size:clamp(1.3rem,3.4vw,1.9rem); letter-spacing:.01em; }
  .wordmark-sub { font-size:.8rem; letter-spacing:.05em; color:var(--dim); }
  .wordmark-note { margin-top:.35rem; font-size:.8rem; font-weight:600; letter-spacing:.03em; color:var(--dim); }

  .bracket-nav { display:flex; gap:1.6rem; flex-wrap:wrap; }
  .bracket-nav button { font:inherit; font-size:.78rem; letter-spacing:.04em; color:var(--dim);
    background:none; border:0; padding:0; cursor:pointer; transition:color .2s; }
  .bracket-nav button::before { content:"[ ] "; }
  .bracket-nav button:hover, .bracket-nav button.on { color:var(--text); }
  .bracket-nav button.on::before { content:"[x] "; }
  .bracket-nav i { font-style:normal; margin-left:.35em; }

  main { max-width:1200px; margin:0 auto; padding:clamp(40px,6vw,72px) var(--pad) clamp(64px,10vw,120px);
    display:flex; flex-direction:column; gap:clamp(2.5rem,6vw,5rem); }
  .card { transition:opacity .2s ease; }
  .card[hidden] { display:none; }
  .card.place-left-lg  { width:72%; }
  .card.place-right-md { width:54%; margin-left:auto; }
  .card.place-left-sm  { width:40%; margin-left:8%; }
  .card.place-right-sm { width:36%; margin-left:auto; margin-right:6%; }
  .thumb { display:block; aspect-ratio:16/10; overflow:hidden; background:#000; position:relative; }
  .thumb canvas { width:100%; height:100%; display:block; transition:transform .5s ease; }
  .card:hover .thumb canvas { transform:scale(1.04); }
  .thumb .cat { position:absolute; left:12px; top:12px; font-size:10px; letter-spacing:.2em; color:#f2f2f2;
    padding:4px 8px; background:rgba(0,0,0,.6); border:1px solid rgba(255,255,255,.2); border-radius:3px; }
  .body { padding-top:.9rem; }
  .name { font-size:.92rem; font-weight:300; font-style:italic; }
  .zh { margin-top:.3rem; font-size:.85rem; font-weight:300; letter-spacing:.12em; }
  .desc { margin-top:.35rem; font-size:.8rem; color:var(--dim); }
  .vers { display:flex; flex-wrap:wrap; gap:.3rem 1.2rem; margin-top:.6rem; font-size:.8rem; }
  .vers a { border-bottom:1px solid var(--text); padding-bottom:.1em; transition:opacity .2s ease; }
  .vers a:hover { opacity:.6; }

  footer { text-align:center; padding:2rem 1rem 2.4rem; color:var(--dim); font-size:.72rem;
    letter-spacing:.04em; border-top:1px solid var(--border); }
  .back-to-top { position:fixed; right:clamp(16px,3vw,32px); bottom:calc(clamp(16px,3vw,32px) + env(safe-area-inset-bottom,0px));
    z-index:200; padding:.55rem .9rem; background:var(--bg); border:1px solid var(--text); font-size:.72rem;
    text-transform:uppercase; letter-spacing:.05em; transition:background .2s ease, color .2s ease; }
  .back-to-top:hover { background:var(--text); color:var(--bg); }

  @media (max-width:860px) {
    .card.place-left-lg, .card.place-right-md, .card.place-left-sm, .card.place-right-sm { width:100%; margin:0; }
    .bracket-nav { gap:1.1rem; }
  }
</style>
</head>
<body>

<p class="tagline">
  <span id="count"></span><br>
  全部在浏览器本地运行，图片不会上传
</p>
<div class="divider" aria-hidden="true"></div>
<div class="row" id="bar">
  <div>
    <div class="wordmark-name">
      <a href="#" class="wordmark">COOLINGDOWN LAB</a>
      <span class="wordmark-sub">图像实验室 · 图片处理程序合集</span>
    </div>
    <p class="wordmark-note">每个工具右下角 ⤓ EXPORT：PNG / JPG 高清 · MP4 / GIF</p>
  </div>
  <nav class="bracket-nav" id="filters"></nav>
</div>

<main id="grid"></main>

<footer>
  <p>&copy; 2026 钟涵哲 Gabrielle Zhong · 点卡片打开默认版本，下面的链接切换其他版本</p>
</footer>
<a href="#" class="back-to-top" id="backToTop" hidden>Back to top ↑</a>

<script>
const CARDS = /*__DATA__*/[]/*__END__*/;
const CATS = { all:"全部", image:"图像", "3d":"3D", type:"字体" };

/* ---------- 卡片缩略图：每种效果一个小的生成图案 ---------- */
const field = (x, y, t) =>
  Math.sin(x * .045 + t) + Math.sin(y * .06 - t * .7) + Math.sin((x + y) * .028 + t * .5) +
  Math.sin(Math.hypot(x - 160, y - 100) * .05 - t);
const thermalCol = v => {               // v: 0..1
  const stops = [[0,0,40],[60,0,140],[200,0,120],[255,80,0],[255,200,0],[255,255,230]];
  const p = Math.min(.999, Math.max(0, v)) * (stops.length - 1), i = p | 0, f = p - i;
  const a = stops[i], b = stops[i + 1];
  return `rgb(${a.map((c, k) => c + (b[k] - c) * f | 0)})`;
};
const ART = {
  vhs(g, w, h, t, a) {
    const grd = g.createLinearGradient(0, 0, 0, h);
    grd.addColorStop(0, "#1a1030"); grd.addColorStop(.6, a); grd.addColorStop(1, "#200");
    g.fillStyle = grd; g.fillRect(0, 0, w, h);
    for (let y = 0; y < h; y += 3) { g.fillStyle = "rgba(0,0,0,.35)"; g.fillRect(0, y, w, 1); }
    const band = (t * 40) % h;
    g.fillStyle = "rgba(255,255,255,.12)"; g.fillRect(0, band, w, 14);
    g.globalCompositeOperation = "screen";
    g.fillStyle = "#f00"; g.fillRect(w * .3 + 3, h * .3, w * .4, h * .35);
    g.fillStyle = "#0ff"; g.fillRect(w * .3 - 3, h * .3, w * .4, h * .35);
    g.globalCompositeOperation = "source-over";
    g.fillStyle = "#fff"; g.font = "bold 16px monospace";
    g.fillText("PLAY ▶", 18, h - 40);
    g.fillText("00:" + String(12 + (t | 0) % 48).padStart(2, "0") + ":34", 18, h - 18);
  },
  ascii(g, w, h, t, a) {
    g.fillStyle = "#000"; g.fillRect(0, 0, w, h);
    const ch = " .:-=+*#%@"; g.font = "10px monospace"; g.fillStyle = a;
    for (let y = 8; y < h; y += 10) for (let x = 0; x < w; x += 7) {
      const v = (field(x, y, t) + 4) / 8;
      g.fillText(ch[Math.min(9, v * 10 | 0)], x, y);
    }
  },
  riso(g, w, h, t) {
    g.fillStyle = "#f3eee2"; g.fillRect(0, 0, w, h);
    g.globalCompositeOperation = "multiply";
    [["#ff48b0", 0], ["#0078bf", 4]].forEach(([c, o]) => {
      g.fillStyle = c;
      for (let y = 0; y < h; y += 8) for (let x = 0; x < w; x += 8) {
        const v = (field(x + o * 6, y, t + o) + 4) / 8;
        g.beginPath(); g.arc(x + o, y + o, v * 4.6, 0, 7); g.fill();
      }
    });
    g.globalCompositeOperation = "source-over";
  },
  citypop(g, w, h, t, a) {
    const sky = g.createLinearGradient(0, 0, 0, h * .62);
    sky.addColorStop(0, "#1b0a3c"); sky.addColorStop(1, a);
    g.fillStyle = sky; g.fillRect(0, 0, w, h);
    const cx = w / 2, cy = h * .62, r = h * .3;
    const sun = g.createLinearGradient(0, cy - r, 0, cy);
    sun.addColorStop(0, "#ffe66d"); sun.addColorStop(1, "#ff2a6d");
    g.fillStyle = sun; g.beginPath(); g.arc(cx, cy, r, Math.PI, 0); g.fill();
    g.fillStyle = "#1b0a3c";
    for (let i = 0; i < 6; i++) g.fillRect(cx - r, cy - 6 - i * 9, r * 2, 2 + i * .6);
    g.fillStyle = "#0a0420"; g.fillRect(0, cy, w, h - cy);
    g.strokeStyle = "#00ffff"; g.lineWidth = 1;
    for (let i = 0; i < 12; i++) {
      const y = cy + Math.pow((i + (t * .6) % 1) / 12, 2) * (h - cy);
      g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke();
    }
    for (let i = -10; i <= 10; i++) { g.beginPath(); g.moveTo(cx + i * 8, cy); g.lineTo(cx + i * 60, h); g.stroke(); }
  },
  haze(g, w, h, t, a) {
    g.fillStyle = "#0a0010"; g.fillRect(0, 0, w, h);
    g.globalCompositeOperation = "lighter";
    [[a, .3, .4], ["#7a00ff", .7, .55], ["#00e0ff", .5, .25], ["#ffcc00", .2, .8]].forEach(([c, x, y], i) => {
      const px = w * (x + Math.sin(t * .7 + i) * .12), py = h * (y + Math.cos(t * .5 + i * 2) * .15);
      const r = g.createRadialGradient(px, py, 0, px, py, w * .38);
      r.addColorStop(0, c); r.addColorStop(1, "transparent");
      g.fillStyle = r; g.fillRect(0, 0, w, h);
    });
    g.globalCompositeOperation = "source-over";
  },
  contour(g, w, h, t, a) {
    g.fillStyle = "#050505"; g.fillRect(0, 0, w, h);
    for (let y = 0; y < h; y += 3) for (let x = 0; x < w; x += 3) {
      const v = field(x, y, t) * 3;
      if (Math.abs(v - Math.round(v)) < .12) { g.fillStyle = Math.round(v) % 2 ? a : "#fff"; g.fillRect(x, y, 3, 3); }
    }
  },
  thermal(g, w, h, t) {
    for (let y = 0; y < h; y += 5) for (let x = 0; x < w; x += 5) {
      g.fillStyle = thermalCol((field(x, y, t) + 4) / 8); g.fillRect(x, y, 5, 5);
    }
    g.strokeStyle = "rgba(255,255,255,.7)"; g.strokeRect(w / 2 - 18, h / 2 - 18, 36, 36);
    g.fillStyle = "#fff"; g.font = "11px monospace"; g.fillText("36.8°C", w / 2 + 24, h / 2 + 4);
  },
  stretch(g, w, h, t) {
    g.fillStyle = "#000"; g.fillRect(0, 0, w, h);
    const split = w * (.45 + Math.sin(t) * .08);
    for (let x = 0; x < split; x += 4) for (let y = 0; y < h; y += 4) {
      g.fillStyle = thermalCol((field(x, y, 0) + 4) / 10 + .15); g.fillRect(x, y, 4, 4);
    }
    for (let y = 0; y < h; y += 2) {
      g.fillStyle = thermalCol((field(split, y, 0) + 4) / 10 + .15); g.fillRect(split, y, w - split, 2);
    }
  },
  dither(g, w, h, t, a) {
    const B = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
    g.fillStyle = "#000"; g.fillRect(0, 0, w, h); g.fillStyle = a;
    for (let y = 0; y < h; y += 3) for (let x = 0; x < w; x += 3) {
      const v = (field(x, y, t) + 4) / 8, th = (B[((y / 3) % 4) * 4 + (x / 3) % 4] + .5) / 16;
      if (v > th) g.fillRect(x, y, 3, 3);
    }
  },
  glitch(g, w, h, t, a) {
    for (let y = 0; y < h; y += 12) for (let x = 0; x < w; x += 12) {
      g.fillStyle = thermalCol((field(x, y, 0) + 4) / 8 * .8); g.fillRect(x, y, 12, 12);
    }
    let s = (t * 5 | 0) * 9301;
    const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    for (let i = 0; i < 9; i++) {
      const y = rnd() * h, hh = 4 + rnd() * 18, dx = (rnd() - .5) * 60;
      const k = g.canvas.width / w; g.drawImage(g.canvas, 0, y * k, w * k, hh * k, dx, y, w, hh);
      if (rnd() > .6) { g.fillStyle = rnd() > .5 ? a : "#ff0055"; g.globalAlpha = .5; g.fillRect(0, y, w, hh); g.globalAlpha = 1; }
    }
  },
  particles(g, w, h, t, a) {
    g.fillStyle = "#000"; g.fillRect(0, 0, w, h); g.fillStyle = a;
    for (let i = 0; i < 900; i++) {
      const p = Math.acos(1 - 2 * (i + .5) / 900), th = Math.PI * (1 + Math.sqrt(5)) * i;
      const r = 1 + .18 * Math.sin(p * 6 + t * 2);
      let x = Math.sin(p) * Math.cos(th) * r, y = Math.cos(p) * r, z = Math.sin(p) * Math.sin(th) * r;
      const c = Math.cos(t * .5), sn = Math.sin(t * .5); [x, z] = [x * c - z * sn, x * sn + z * c];
      const k = 2.6 / (3.2 + z);
      g.globalAlpha = .35 + (1 - z) * .3;
      g.fillRect(w / 2 + x * h * .38 * k, h / 2 + y * h * .38 * k, 1.6, 1.6);
    }
    g.globalAlpha = 1;
  },
  terrain(g, w, h, t, a) {
    g.fillStyle = "#000500"; g.fillRect(0, 0, w, h);
    g.strokeStyle = a; g.lineWidth = 1;
    for (let r = 0; r < 26; r++) {
      const zf = r / 26, z = 1 - zf, y0 = h * .28 + Math.pow(zf, 1.6) * h * .8;
      g.globalAlpha = .25 + zf * .75; g.beginPath();
      for (let c = 0; c <= 40; c++) {
        const u = c / 40 - .5, x = w / 2 + u * w * (.5 + zf * 1.3);
        const ht = (field(c * 9, r * 9 + t * 25, 0) + 4) * (8 + zf * 10);
        c ? g.lineTo(x, y0 - ht) : g.moveTo(x, y0 - ht);
      }
      g.stroke();
    }
    g.globalAlpha = 1;
  },
  type(g, w, h, t, a) {
    g.fillStyle = "#0d0d0d"; g.fillRect(0, 0, w, h);
    g.font = `900 ${h * .62}px Helvetica, Arial, sans-serif`; g.textAlign = "center"; g.textBaseline = "middle";
    for (let y = 0; y < h; y += 6) {
      g.save(); g.beginPath(); g.rect(0, y, w, 6); g.clip();
      const dx = Math.sin(y * .05 + t * 2) * 14;
      g.fillStyle = y % 12 ? "#fff" : a; g.fillText("Aa", w / 2 + dx, h / 2);
      g.restore();
    }
    g.textAlign = "start"; g.textBaseline = "alphabetic";
  },
  chrome(g, w, h, t, a) {
    g.fillStyle = "#000"; g.fillRect(0, 0, w, h);
    g.font = `900 ${h * .72}px Helvetica, Arial, sans-serif`; g.textAlign = "center"; g.textBaseline = "middle";
    const sh = Math.sin(t) * h * .3;
    const m = g.createLinearGradient(0, h * .15 + sh, 0, h * .85 + sh);
    ["#222", "#fff", "#555", a, "#eee", "#111"].forEach((c, i, arr) => m.addColorStop(i / (arr.length - 1), c));
    g.fillStyle = m; g.fillText("Zz", w / 2, h / 2 + 4);
    g.textAlign = "start"; g.textBaseline = "alphabetic";
  },
};

/* ---------- 渲染 ---------- */
const grid = document.getElementById("grid");
document.getElementById("count").textContent =
  `${CARDS.length} 个效果 · ${CARDS.reduce((n, c) => n + c.versions.length, 0)} 个工具`;

const W = 320, H = 200, DPR = 3;
CARDS.forEach(c => {
  const el = document.createElement("article");
  el.className = "card"; el.dataset.cat = c.cat;
  el.innerHTML = `
    <a class="thumb" href="${encodeURI(c.versions[0].href)}"><canvas width="${W * DPR}" height="${H * DPR}"></canvas>
      <span class="cat">${CATS[c.cat]}</span></a>
    <div class="body">
      <a class="name" href="${encodeURI(c.versions[0].href)}">${c.name}</a>
      <div class="zh">${c.zh}</div>
      <p class="desc">${c.desc}</p>
      <div class="vers">${c.versions.map(v => `<a href="${encodeURI(v.href)}">${v.label} →</a>`).join("")}</div>
    </div>`;
  grid.appendChild(el);

  const cv = el.querySelector("canvas"), g = cv.getContext("2d");
  g.scale(DPR, DPR);
  const draw = t => ART[c.art](g, W, H, t, c.accent);
  draw(0);
  let raf = 0, t0 = 0;
  const loop = now => { draw((now - t0) / 1000); raf = requestAnimationFrame(loop); };
  el.addEventListener("mouseenter", () => { t0 = performance.now(); raf = requestAnimationFrame(loop); });
  el.addEventListener("mouseleave", () => { cancelAnimationFrame(raf); });
});

/* ---------- 错落排版：按当前可见的卡片依次左右交替 ---------- */
const PLACES = ["place-left-lg", "place-right-md", "place-left-sm", "place-right-sm"];
const stagger = () => {
  [...grid.querySelectorAll(".card:not([hidden])")].forEach((card, i) => {
    card.classList.remove(...PLACES);
    card.classList.add(PLACES[i % PLACES.length]);
  });
};
stagger();

/* ---------- 筛选 ---------- */
const nav = document.getElementById("filters");
Object.entries(CATS).forEach(([k, label]) => {
  const n = k === "all" ? CARDS.length : CARDS.filter(c => c.cat === k).length;
  const b = document.createElement("button");
  b.innerHTML = `${label}<i>${n}</i>`; b.className = k === "all" ? "on" : "";
  b.onclick = () => {
    nav.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    grid.querySelectorAll(".card").forEach(card => card.hidden = k !== "all" && card.dataset.cat !== k);
    stagger();
    window.scrollTo(0, 0);
  };
  nav.appendChild(b);
});

/* ---------- 吸顶栏分隔线 + 回到顶部 ---------- */
const bar = document.getElementById("bar"), toTop = document.getElementById("backToTop");
const onScroll = () => {
  bar.classList.toggle("scrolled", scrollY > 10);
  toTop.hidden = scrollY < 400;
};
addEventListener("scroll", onScroll); onScroll();
</script>
</body>
</html>
